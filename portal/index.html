<style>

.sub { color: rgba(255,255,255,.7); font-size: 14px; margin-top: 16px; text-align: center; }

body { background: radial-gradient(70% 50% at 80% 0%, rgba(242,47,61,.35), transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(245,165,36,.16), transparent 70%), linear-gradient(170deg, #1A1830, #241F38 55%, #2E1C33); background-attachment: fixed; }

.fb { background: #15131F; border-radius: 18px; padding: 16px 14px 14px; box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); text-align: left; }

@media (prefers-reduced-motion: reduce) { .fb-c.f, .ld-bar i, .fb-h i { animation: none; } .fb-pass { animation: none; clip-path: none; } }

.gh { position: relative; overflow: hidden; isolation: isolate; width: calc(100% + 40px); margin: 0 -20px; min-height: 430px; padding: max(22px, env(safe-area-inset-top)) 24px 70px; border-radius: 0 0 36px 36px;
  background: radial-gradient(70% 60% at 100% 0%, rgba(242,47,61,.55), transparent 70%), radial-gradient(60% 60% at 0% 100%, rgba(62,107,214,.25), transparent 70%), linear-gradient(160deg, #1A1830 0%, #2E2440 55%, #4A1E33 100%); }
.gh-map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.gh-plane { position: absolute; right: -40px; top: 78px; width: 190px; height: 190px; transform: rotate(-24deg); z-index: -1; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); animation: ghFly 7s ease-in-out infinite alternate; }
@keyframes ghFly { to { transform: rotate(-21deg) translate(-6px, -8px); } }
.gh-in { position: relative; text-align: left; }
.gh-logo { height: 36px; display: block; margin-bottom: 44px; }
.gh-eb { font-size: 10.5px; letter-spacing: .18em; font-weight: 700; color: #F6C77A; }
.gh h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 38px; line-height: 1.04; margin: 10px 0 0; max-width: 260px; }
.gh p { color: rgba(255,255,255,.78); font-size: 15px; line-height: 1.45; margin: 12px 0 0; max-width: 270px; }
.gh-go { margin-top: 22px; border: 0; border-radius: 14px; background: #fff; color: #302D40; font: inherit; font-weight: 700; font-size: 16px; padding: 14px 20px; cursor: pointer; min-height: 50px; box-shadow: 0 16px 30px -14px rgba(0,0,0,.6); }
.gh-go span { color: #F22F3D; margin-left: 6px; }

.uf-top { display: flex; align-items: center; gap: 10px; padding: 6px 0 10px; }

<body>
<div class="shell" id="shell">
<img class="logo" id="logo" src="logo.png" alt="Akbar Study Abroad" onerror="this.outerHTML='<div class=&quot;logo-fb&quot;>AKB<b>A</b>R</div>'">
<div id="view"><div class="spin" aria-label="Loading"></div></div>
</div>
<script>
(function () {
'use strict';
var API = 'https://script.google.com/macros/s/AKfycbzM25HLBhuI36dn-uUgdTUoXiiTXABMBNDuaBMGjC_SUUU9eueVPn35lFowwBIqb1XNTw/exec';
var KEY = 'akbar_student_session', CACHE = 'akbar_app_copy';
var PAGE_FNS = ['uniFinderOptions', 'uniFinderMatch', 'uniFinderSave', 'getStudentPortalData', 'submitStudentDocument', 'submitStudentFeedback', 'getStudentPortalExtras', 'setStudentChecklistItem', 'askStudentQuestion', 'studentUploadRequested', 'raiseStudentEscalation', 'requestStudentSlot', 'bookIeltsSeat', 'cancelIeltsSeat', 'requestTravelService', 'toggleShortlistFav', 'rateStudentService', 'setStudentLoan', 'setCommunityOptIn', 'stuFlightFares', 'getFlyTogether', 'setFlyTogether'];
var view = document.getElementById('view');
var state = { phone: '', sent: '', mode: 'login', info: null, su: {} };

function newRid() { var a = ''; while (a.length < 24) a += Math.random().toString(36).slice(2); return 'r' + Date.now().toString(36) + a.slice(0, 20); }
function call(fn, args, tries, rid) {
  rid = rid || newRid();
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [], rid: rid }) })
    .then(function (r) { return r.text(); })
    .then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { throw new Error('BUSY'); } if (!j.ok) throw new Error(j.e || 'SERVER_ERROR'); return j.v; })
    .catch(function (e) { if ((tries || 0) < 2 && (e.message === 'BUSY' || e.name === 'TypeError')) return new Promise(function (ok) { setTimeout(ok, 2500); }).then(function () { return call(fn, args, (tries || 0) + 1, rid); }); throw e; });
}
function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function set(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nice(e) {
  var m = String((e && e.message) || e || '');
  if (m === 'BUSY' || m === 'Failed to fetch' || (e && e.name === 'TypeError')) return 'No connection right now — check your internet and try again.';
  if (m === 'TOKEN_EXPIRED' || m === 'INVALID_TOKEN') return 'That link has expired — sign in with your mobile number instead.';
  if (m === 'TOKEN_REVOKED' || m === 'ACCESS_OFF') return 'Your portal access is switched off. Please contact your counsellor.';
  if (m === 'SERVER_ERROR') return 'Something went wrong — please try again in a minute.';
  return m.replace(/^Error:\s*/, '');
}
// PREMIUM LOADING (30 Oct 2026): the plane flies the route, the step text moves on, and a study-abroad tip rotates
var LD_STEPS = ['Finding your application…', 'Checking your documents…', 'Getting your visa updates…', 'Lining up your next steps…', 'Almost there…'];
var LD_TIPS = ['Carry your passport, visa and offer letter in your hand luggage — never in checked bags.', 'Many universities offer free airport pickup — book it as soon as you have your flight.',
  'Scan every important document and keep a copy online in case anything gets lost.', 'Start your accommodation search early — the best rooms near campus go first.',
  'Ask your counsellor anything in the app — answers stay saved for you.', 'Keep some local currency for your first few days, plus a forex card.', 'Check your baggage allowance before you pack — excess baggage is expensive at the airport.'];
var ldTimer = null;
function ldRoute() {
  var r = {}; try { r = JSON.parse(localStorage.getItem('ak_route') || '{}') || {}; } catch (e) { r = {}; }
  var SHORT = { 'UNITED KINGDOM': 'UK', 'UNITED STATES': 'USA', 'UNITED STATES OF AMERICA': 'USA', 'UNITED ARAB EMIRATES': 'UAE' };
  var up = function (v, d) { v = String(v || '').toUpperCase().replace(/[^A-Z ]/g, '').trim(); v = SHORT[v] || v; return (v || d).slice(0, 11); };
  return { a: up(r.a, 'INDIA'), b: up(r.b, 'ABROAD'), w: String(r.w || '').toUpperCase().slice(0, 10), n: String(r.n || '').slice(0, 20) };
}
var FB_CH = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function fbRow(label, text) {
  var c = ''; for (var x = 0; x < 11; x++) c += '<span class="fb-c" data-t="' + (text.charAt(x) || ' ') + '"> </span>';
  return '<div class="fb-r"><small>' + label + '</small><div class="fb-cells">' + c + '</div></div>';
}
function fbRun(root) {
  var cells = root.querySelectorAll('.fb-c'), calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  Array.prototype.forEach.call(cells, function (el, n) {
    var t = el.getAttribute('data-t'), goal = FB_CH.indexOf(t); if (goal < 0) goal = 0;
    if (calm || goal === 0) { el.textContent = t; return; }
    var k = 0, start = Math.max(1, goal - 8 - (n % 5));
    setTimeout(function tick() {
      if (!el.isConnected) return;
      k = k ? k + 1 : start; el.textContent = FB_CH.charAt(k); el.classList.remove('f'); void el.offsetWidth; el.classList.add('f');
      if (k < goal) setTimeout(tick, 55);
    }, 120 + (n % 11) * 70 + Math.floor(n / 11) * 180);
  });
}
function loading(t) {
  clearInterval(ldTimer);
  var i = 0, k = Math.floor(Math.random() * LD_TIPS.length), R = ldRoute();
  view.innerHTML = '<div class="ld" role="status" aria-live="polite"><div class="fb" aria-label="' + esc(R.a + ' to ' + R.b) + '"><div class="fb-h"><span>AKBAR STUDY ABROAD · DEPARTURES</span><i></i></div>' +
    fbRow('FROM', R.a) + fbRow('TO', R.b) + '<div class="fb-pass"><div>PASSENGER<b>' + esc(R.n || 'Student') + '</b></div><div style="text-align:right">INTAKE<b>' + esc(R.w || 'Boarding') + '</b></div></div></div>' +
    '<div class="ld-step" id="ldStep">' + esc(t || LD_STEPS[0]) + '</div><div class="ld-bar"><i></i></div><div class="ld-tip" id="ldTip"><b>Tip</b>' + esc(LD_TIPS[k]) + '</div></div>';
  fbRun(view);
  if (t) return;
  ldTimer = setInterval(function () {
    var st = document.getElementById('ldStep'), tp = document.getElementById('ldTip');
    if (!st) { clearInterval(ldTimer); return; }
    i = Math.min(i + 1, LD_STEPS.length - 1); st.textContent = LD_STEPS[i];
    if (i % 2 === 0 && tp) { k = (k + 1) % LD_TIPS.length; tp.style.opacity = 0; setTimeout(function () { tp.innerHTML = '<b>Tip</b>' + esc(LD_TIPS[k]); tp.style.opacity = 1; }, 300); }
  }, 1700);

    '<label for="suP" style="margin-top:12px">Mobile number</label><div class="in"><span>+91</span><input id="suP" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="98470 12345" value="' + esc(su.phone || state.phone || '') + '"></div>' +
    '<label for="suE" style="margin-top:12px">Email (your code is sent here)</label><div class="in"><input id="suE" class="plain" type="email" autocomplete="email" maxlength="120" value="' + esc(su.email || '') + '"></div>' +
    '<label for="suC" style="margin-top:12px">Where do you want to study?</label><div class="in"><select id="suC">' + opt(info.countries, su.country, 'Choose a country') + '</select></div>' +
    '<label for="suB" style="margin-top:12px">Nearest Akbar branch</label><div class="in"><select id="suB">' + opt(info.branches, su.branch, 'Choose a branch') + '</select></div>' +
    '<button class="btn" id="suGo">Send my code</button><div class="msg ' + (bad ? 'bad' : '') + '" id="msg">' + esc(msg || '') + '</div>' +
    '<div class="fine">By creating an account you agree that Akbar Study Abroad may contact you by phone, WhatsApp or email about studying abroad.</div>' +
    '<button class="link" id="suBack">I already have an account — sign in</button></div>';
  document.getElementById('suGo').onclick = sendSignup;
  document.getElementById('suBack').onclick = function () { phoneView(); };
}
function sendSignup() {
  var v = function (id) { return String(document.getElementById(id).value || '').trim(); };
  var ref = ''; try { ref = sessionStorage.getItem('ak_ref') || ''; } catch (e) { ref = ''; } // REFER A FRIEND (30 Oct 2026)
  state.su = { name: v('suN'), phone: v('suP'), email: v('suE'), country: v('suC'), branch: v('suB'), ref: ref, src: get('ak_uf_send') === '1' ? 'finder' : '' };
  var su = state.su;
  if (su.name.length < 2) { show('Enter your full name.', true); return; }
  if (digits(su.phone).length < 10) { show('Enter your 10-digit mobile number.', true); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(su.email)) { show('Enter a valid email.', true); return; }
  if (!su.country) { show('Choose where you want to study.', true); return; }
  if (!su.branch) { show('Choose your nearest branch.', true); return; }
  var b = document.getElementById('suGo'); b.disabled = true; b.textContent = 'Sending…'; show('');
  state.phone = su.phone;
  call('studentSignupStart', [su]).then(function (r) {
    if (r.exists) {
      state.mode = 'login';
      return call('studentLoginStart', [su.phone]).then(function (x) {
        if (x.sent === 'email') { state.sent = x.to; codeView('You already have an account with us — we sent you a sign-in code.'); }
        else phoneView('You already have an account with us. ' + (x.message || ''), true);
      });
    }
    state.sent = r.to; codeView();
  }).catch(function (e) { b.disabled = false; b.textContent = 'Send my code'; show(nice(e), true); });
}
// ---- OPEN STUDENT APP: explore with a sample student ----
function openDemo() {
  loading('Opening the demo…');
  call('getStudentAppDemo', []).then(function (r) { writePage(String(r.html || ''), false, true); })
    .catch(function (e) { phoneView(nice(e), true); });
}

function shim(signedIn, demo) {
  return '<script>(function(){var API=' + JSON.stringify(API) + ',KEY=' + JSON.stringify(KEY) + ',OK=' + JSON.stringify(PAGE_FNS) + ',DEMO=' + (demo ? 'true' : 'false') + ';window.DEMO=DEMO;' +
    'function run(){var ok=null,fail=null,r={withSuccessHandler:function(f){ok=f;return r},withFailureHandler:function(f){fail=f;return r},withUserObject:function(){return r}};' +
    'OK.forEach(function(fn){r[fn]=function(){if(DEMO){setTimeout(function(){fail&&fail(new Error("This is a demo — create your free account to use this."))},60);return}var a=[].slice.call(arguments);fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:a})})' +
    '.then(function(x){return x.text()}).then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error("Google was busy — please try again.")}if(j.ok){ok&&ok(j.v)}else{throw new Error(j.e||"SERVER_ERROR")}})' +
    '.catch(function(e){if(String(e&&e.message).indexOf("fetch")!==-1)e=new Error("No connection — check your internet and try again.");fail&&fail(e)})}});return r}' +
    'window.google={script:{get run(){return run()}}};document.title="Akbar Student";' +
    'if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}' +
    'window.addEventListener("beforeinstallprompt",function(ev){ev.preventDefault();window.__akInstall=ev;var b=document.getElementById("akInstall");if(b)b.style.display="inline-block"});' +
    'document.addEventListener("DOMContentLoaded",function(){var f=document.createElement("div");f.style.cssText="text-align:center;padding:4px 16px 24px;font-size:13px;color:#6B7280";' +
    'var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),sa=window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;' +
    'f.innerHTML=(sa?"":"<button id=\\"akInstall\\" style=\\"display:none;border:0;background:#302D40;color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;margin:0 6px 10px\\">📲 Install the Akbar app</button>"+(ios?"<div style=\\"margin-bottom:10px\\">📲 To get the app: tap Share → <b>Add to Home Screen</b></div>":""))' +
    '+' + (demo ? '"<div style=\\"background:#302D40;color:#fff;border-radius:14px;padding:14px;margin:0 auto 12px;max-width:520px\\"><b>👀 You are exploring a demo</b><br><span style=\\"opacity:.8\\">This is how your journey will look with Akbar Study Abroad.</span><br><button id=\\"akSignup\\" style=\\"margin-top:10px;border:0;background:#F22F3D;color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer\\">✨ Create your free account</button> <button id=\\"akHome\\" style=\\"margin-top:10px;border:0;background:none;color:#fff;text-decoration:underline;font:inherit;cursor:pointer\\">Back</button></div>"+' : '') + (signedIn ? '"<button id=\\"akOut\\" style=\\"border:0;background:none;color:#6B7280;text-decoration:underline;font:inherit;cursor:pointer\\">Sign out</button>"' : '""') + ';' +
    'var app=document.getElementById("app");(app&&app.parentNode?app.parentNode:document.body).insertBefore(f,document.getElementById("sxNav")||null);' +
    'var ib=document.getElementById("akInstall");if(ib){if(window.__akInstall)ib.style.display="inline-block";ib.onclick=function(){if(window.__akInstall){window.__akInstall.prompt();window.__akInstall=null;ib.style.display="none"}}}' +
    'var su=document.getElementById("akSignup");if(su)su.onclick=function(){location.replace(location.pathname+"#signup")};var hm=document.getElementById("akHome");if(hm)hm.onclick=function(){location.replace(location.pathname)};' +
    'var ob=document.getElementById("akOut");if(ob)ob.onclick=function(){var s=null;try{s=localStorage.getItem(KEY);localStorage.removeItem(KEY);localStorage.removeItem("akbar_app_copy")}catch(e){}' +
    'fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:"studentLogout",args:[s]})}).catch(function(){}).then(function(){location.replace(location.pathname)})}});' +
    '})();<\/script>';
}
function writePage(html, signedIn, demo, staleSig) {
  clearInterval(ldTimer);
  if (staleSig) { var bi = html.lastIndexOf('</body>'), inj = '<script>(' + bgRefresh.toString() + ')(' + JSON.stringify(API) + ',' + JSON.stringify(KEY) + ',' + JSON.stringify(CACHE) + ',' + JSON.stringify(staleSig) + ')<\/script>'; html = bi === -1 ? html + inj : html.slice(0, bi) + inj + html.slice(bi); }
  html = html.replace(/<link rel="manifest"[^>]*>/i, '<link rel="manifest" href="manifest.json">').replace(/<base target="_top">/i, '');
  html = html.replace(/<link rel="apple-touch-icon"[^>]*>/i, '<link rel="apple-touch-icon" href="apple-touch-icon.png">');
  html = html.replace('<head>', '<head>' + shim(signedIn, demo));
  document.open(); document.write(html); document.close();
}
// runs INSIDE the opened page when it came from the saved copy: fetch the latest, save it, and swap only if something changed
function bgRefresh(API, KEY, CACHE, SIG) {
  var touched = false, s = null;
  ['pointerdown', 'keydown', 'scroll'].forEach(function (ev) { window.addEventListener(ev, function () { touched = true; }, { once: true, passive: true }); });
  try { s = localStorage.getItem(KEY); } catch (e) { return; }
  if (!s) return;
  var pill = function (txt, act) {
    var p = document.createElement('button'); p.type = 'button'; p.textContent = txt;
    p.setAttribute('style', 'position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:60;border:0;border-radius:999px;padding:10px 16px;font:700 13px system-ui,sans-serif;color:#fff;background:#F22F3D;box-shadow:0 12px 26px -10px rgba(242,47,61,.7);cursor:pointer');
    p.onclick = act; document.body.appendChild(p); return p;
  };
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'studentAppOpen', args: [s] }) })
    .then(function (r) { return r.text(); }).then(function (t) {
      var j = JSON.parse(t);
      if (!j.ok) { if (j.e === 'SIGNED_OUT' || j.e === 'ACCESS_OFF') { try { localStorage.removeItem(CACHE); localStorage.removeItem(KEY); } catch (e) { /* ignore */ } location.reload(); } return; }
      try { sessionStorage.setItem('ak_fresh', String(Date.now())); } catch (e) { /* ignore */ }
      if (j.v.sig === SIG) return;
      try { localStorage.setItem(CACHE, JSON.stringify({ k: s, t: Date.now(), sig: j.v.sig, html: j.v.html })); } catch (e) { /* phone storage full: the next open loads normally */ }
      if (!touched) { location.reload(); return; }
      pill('✨ New updates — tap to refresh', function () { location.reload(); });
    }).catch(function () { /* offline: keep the saved copy */ });
}
function openPortal(token, signedIn) {
  loading();
  call('getStudentAppPage', [token]).then(function (r) {
    writePage(String(r.html || ''), signedIn, false);
  }).catch(function (e) {
    var m = String(e && e.message);
    if (m === 'TOKEN_EXPIRED' || m === 'INVALID_TOKEN' || m === 'TOKEN_REVOKED') { phoneView(nice(e), true); return; }
    view.innerHTML = '<div class="card"><h1>Couldn’t open your portal</h1><p>' + esc(nice(e)) + '</p><button class="btn" id="re">Try again</button></div>';
    document.getElementById('re').onclick = function () { openPortal(token, signedIn); };
  });
}

function start() {
  try { var rf = new URLSearchParams(location.search).get('ref'); if (rf && /^AK[A-Z0-9]{6}$/.test(rf)) sessionStorage.setItem('ak_ref', rf); } catch (e) { /* ignore */ }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
  var h = String(location.hash || ''), m = /[#&]t=([a-f0-9]{32})/.exec(h);
  var fz = false; try { fz = sessionStorage.getItem('ak_finder') === '1'; sessionStorage.removeItem('ak_finder'); } catch (e) { fz = false; }
  if (fz || /#finder/.test(h)) { if (/#finder/.test(h)) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } } finderStart(); return; }
  if (m) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } try { sessionStorage.setItem('akbar_link_token', m[1]); } catch (e) { /* ignore */ } }
  var s = get(KEY);
  if (s) {
    // INSTANT OPEN (30 Oct 2026): show the copy saved on this phone straight away; the page checks for changes in the background
    var c = null; try { c = JSON.parse(get(CACHE) || 'null'); } catch (e) { c = null; }
    var force = false, fresh = false; try { force = sessionStorage.getItem('ak_force') === '1'; sessionStorage.removeItem('ak_force'); fresh = Date.now() - Number(sessionStorage.getItem('ak_fresh') || 0) < 90000; } catch (e) { force = false; }
    if (!force && c && c.k === s && c.html && Date.now() - c.t < 30 * 864e5) { writePage(c.html, true, false, fresh ? '' : (c.sig || 'x')); return; }
    loading();
    call('studentAppOpen', [s]).then(function (r) {
      set(CACHE, JSON.stringify({ k: s, t: Date.now(), sig: r.sig, html: r.html })); try { sessionStorage.setItem('ak_fresh', String(Date.now())); } catch (e) { /* ignore */ }
      writePage(String(r.html || ''), true, false, '');
    }).catch(function (e) {
      var msg = String(e && e.message);
      if (msg === 'SIGNED_OUT') { set(KEY, null); set(CACHE, null); phoneView('Please sign in again.'); }
      else if (msg === 'ACCESS_OFF') { set(KEY, null); set(CACHE, null); phoneView(nice(e), true); }
      else if (c && c.k === s && c.html) { writePage(c.html, true, false, ''); }
      else { view.innerHTML = '<div class="card"><h1>No connection</h1><p>' + esc(nice(e)) + '</p><button class="btn" id="re">Try again</button></div>'; document.getElementById('re').onclick = start; }
    });
    return;
  }
  var lt = null; try { lt = sessionStorage.getItem('akbar_link_token'); } catch (e) { lt = null; }
  if (lt) { openPortal(lt, false); return; }
  if (/#signup/.test(h)) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } signupView(); return; }
  if (/#demo/.test(h)) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } openDemo(); return; }
  phoneView();
}
start();
})();
