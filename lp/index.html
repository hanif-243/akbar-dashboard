<style>
:root { --navy: #101B32; --navy2: #182746; --ivory: #F8F6F0; --ivory2: #F1EDE3; --gold: #C5A46D; --gold2: #9C7C45; --ink: #101B32; --muted: #59627A; --line: #E7E1D3; --card: #fff; --ok: #1E7F55; --err: #B4232F; --r: 16px;
  --serif: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Noto Serif', serif; --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--ivory); line-height: 1.55; -webkit-font-smoothing: antialiased; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
button, input, select { font: inherit; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 18px; }
.eyebrow { font: 700 12px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: 8px; }
.eyebrow::before { content: ''; width: 22px; height: 1px; background: currentColor; }
h1, h2.t, .serif { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; }
/* header */
.dl { background: var(--gold); color: var(--navy); text-align: center; font-size: 13.5px; font-weight: 700; padding: 7px 12px; }
.top { position: sticky; top: 0; z-index: 20; background: rgba(16,27,50,.97); border-bottom: 1px solid rgba(197,164,109,.25); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 62px; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-weight: 700; font-size: 15px; line-height: 1.15; }
.logo img { width: 34px; height: 34px; border-radius: 9px; background: #fff; }
.logo small { display: block; font-size: 11px; font-weight: 500; color: var(--gold); letter-spacing: .04em; }
.top a.call { text-decoration: none; font-weight: 700; font-size: 14px; color: #fff; border: 1px solid rgba(197,164,109,.6); padding: 9px 14px; border-radius: 999px; white-space: nowrap; }
/* hero */
.hero { background: radial-gradient(900px 420px at 85% 0%, rgba(197,164,109,.16), transparent 60%), linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); color: #fff; }
.hero .wrap { display: grid; grid-template-columns: 1.08fr .92fr; grid-template-areas: "intro card" "more card"; column-gap: 52px; padding-top: 48px; padding-bottom: 60px; align-items: start; }
.intro { grid-area: intro; } .more { grid-area: more; } .hero .card { grid-area: card; }
h1 { font-size: clamp(30px, 4.3vw, 54px); line-height: 1.06; margin: 14px 0 14px; color: #fff; }
.sub { font-size: clamp(16px, 1.5vw, 18.5px); color: rgba(255,255,255,.78); margin: 0 0 22px; max-width: 560px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; padding: 0; list-style: none; }
.chips li { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; }
.ticks { list-style: none; padding: 0; margin: 0 0 26px; display: grid; gap: 11px; }
.ticks li { position: relative; padding-left: 30px; font-size: 15.5px; color: rgba(255,255,255,.92); }
.ticks li::before { content: ''; position: absolute; left: 0; top: 3px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--gold); background: radial-gradient(circle, var(--gold) 0 3px, transparent 3.5px); }
.frame { position: relative; border-radius: 22px; padding: 8px; background: linear-gradient(135deg, rgba(197,164,109,.7), rgba(197,164,109,.1)); }
.heroimg { width: 100%; height: auto; aspect-ratio: 16/10; object-fit: cover; border-radius: 16px; background: var(--navy2); }
.illus { width: 100%; height: auto; border-radius: 18px; }
/* quiz card */
.card { background: var(--card); color: var(--ink); border-radius: 22px; padding: 24px; border-top: 3px solid var(--gold); box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
.card h2 { margin: 0 0 3px; font: 600 21px/1.25 var(--serif); }
.card .hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.prog { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.prog .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--ivory2); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width .25s ease; }
.q { font-weight: 700; font-size: 15.5px; margin: 6px 0 10px; }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 0 16px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: flex; align-items: center; gap: 9px; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; background: #fff; line-height: 1.25; }
.opt input:checked + span { border-color: var(--gold2); background: #FBF6EC; color: var(--navy); box-shadow: inset 0 0 0 1px var(--gold2); }
.opt input:focus-visible + span { outline: 3px solid rgba(197,164,109,.55); outline-offset: 1px; }
.fl { display: inline-block; flex: 0 0 auto; width: 26px; height: 18px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.fl svg { width: 100%; height: 100%; }
.chips .fl { width: 20px; height: 14px; margin-right: 7px; }
.f { margin-bottom: 12px; }
.f label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
.f input, .f select { width: 100%; height: 50px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: #fff; color: var(--ink); }
.f input:focus, .f select:focus { outline: none; border-color: var(--gold2); box-shadow: 0 0 0 3px rgba(197,164,109,.3); }
.phone { display: flex; gap: 8px; } .phone .cc { flex: 0 0 72px; text-align: center; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.nav { display: flex; gap: 8px; align-items: center; }
.back { border: 0; background: none; color: var(--muted); font-weight: 700; padding: 0 10px; height: 54px; cursor: pointer; }
button.go { flex: 1; height: 54px; border: 0; border-radius: 13px; background: var(--navy); color: #fff; font-size: 16.5px; font-weight: 700; cursor: pointer; letter-spacing: .01em; }
button.go::after { content: ''; }
button.go:hover { background: #0B1426; }
button.go:disabled { opacity: .65; }
.err { color: var(--err); font-size: 14px; font-weight: 600; margin: 8px 0 0; }
.small { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; text-align: center; }
.consent { font-size: 12px; color: var(--muted); margin: 10px 0 0; text-align: center; } .consent a { color: var(--muted); }
.fallback { display: block; margin-top: 8px; color: var(--ok); font-weight: 700; }
.done { text-align: center; padding: 8px 0; }
.done .ic { width: 62px; height: 62px; border-radius: 50%; background: #FBF6EC; color: var(--gold2); border: 1.5px solid var(--gold); display: grid; place-items: center; margin: 0 auto 12px; font-size: 28px; font-weight: 700; }
.done h2 { font: 600 23px/1.25 var(--serif); } .done p { color: var(--muted); }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 13px; background: #1FAF54; color: #fff; text-decoration: none; font-weight: 700; margin-top: 12px; padding: 0 14px; }
.alt { display: block; margin-top: 12px; font-weight: 700; color: var(--gold2); text-decoration: none; }
/* sections */
section.band { padding: 64px 0; content-visibility: auto; contain-intrinsic-size: 1px 600px; }
section.white { background: #fff; }
.head { text-align: center; max-width: 680px; margin: 0 auto 34px; }
h2.t { font-size: clamp(25px, 3vw, 38px); line-height: 1.15; margin: 10px 0 10px; }
.head p { color: var(--muted); margin: 0; font-size: 16px; }
.impact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-top: -34px; position: relative; z-index: 2; box-shadow: 0 24px 50px -36px rgba(16,27,50,.45); }
.impact div { padding: 24px 18px; text-align: center; border-left: 1px solid var(--line); }
.impact div:first-child { border-left: 0; }
.impact b { display: block; font: 600 clamp(24px, 2.6vw, 32px)/1.1 var(--serif); color: var(--navy); }
.impact b em { font-style: normal; color: var(--gold2); }
.impact span { display: block; margin-top: 6px; color: var(--muted); font-size: 14px; font-weight: 600; }
.services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.svc { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.svc .ico { width: 44px; height: 44px; border-radius: 12px; background: #FBF6EC; border: 1px solid #EBDDC2; display: grid; place-items: center; margin-bottom: 14px; }
.svc .ico svg { width: 22px; height: 22px; fill: none; stroke: var(--gold2); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.svc b { display: block; font-size: 16.5px; margin-bottom: 4px; } .svc span { color: var(--muted); font-size: 14.5px; }
.courses { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.courses span { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 14.5px; }
.note { text-align: center; color: var(--muted); font-size: 13.5px; margin: 18px auto 0; max-width: 640px; }
/* roadmap */
.road { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; counter-reset: r; }
.road::before { content: ''; position: absolute; left: 8%; right: 8%; top: 23px; height: 2px; background: linear-gradient(90deg, var(--gold), rgba(197,164,109,.25)); }
.rs { position: relative; text-align: center; padding: 0 4px; }
.rs::before { counter-increment: r; content: counter(r); position: relative; z-index: 1; display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 50%; background: var(--navy); color: var(--gold); font: 600 19px/1 var(--serif); border: 2px solid var(--gold); box-shadow: 0 0 0 6px var(--ivory); }
.rs b { display: block; font-size: 15px; margin-bottom: 4px; } .rs span { color: var(--muted); font-size: 13.5px; display: block; } .rs i { display: inline-block; margin-top: 6px; font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--gold2); letter-spacing: .06em; text-transform: uppercase; }
/* eligibility */
.elig { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
.elig ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.elig li { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 46px; position: relative; font-weight: 600; }
.elig li::before { content: ''; position: absolute; left: 16px; top: 17px; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--gold2); background: linear-gradient(135deg, transparent 45%, var(--gold2) 45% 55%, transparent 55%); }
.elig li small { display: block; font-weight: 500; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.photos img { width: 100%; height: auto; aspect-ratio: 4/5; object-fit: cover; border-radius: 16px; background: var(--ivory2); }
/* testimonials carousel */
.tcar { position: relative; }
.track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 4px 2px 8px; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.quote { flex: 0 0 calc((100% - 32px) / 3); scroll-snap-align: start; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; font-size: 15.5px; }
.quote .mark { font: 600 44px/0.6 var(--serif); color: var(--gold); display: block; margin-bottom: 10px; }
.quote .who { display: flex; align-items: center; gap: 11px; margin-top: 16px; }
.quote .av { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-weight: 700; flex: 0 0 auto; }
.quote .who b { display: block; font-size: 14.5px; } .quote .who span { font-size: 13px; color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: #D9D1BF; cursor: pointer; }
.dots button[aria-current="true"] { background: var(--gold2); width: 24px; border-radius: 5px; }
/* faq */
.faq { max-width: 780px; margin: 0 auto; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; padding: 18px 44px 18px 2px; font-weight: 700; font-size: 16px; list-style: none; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; position: absolute; right: 6px; top: 13px; font: 400 26px/1 var(--serif); color: var(--gold2); }
.faq details[open] summary::after { content: '−'; }
.faq p { margin: 0; padding: 0 2px 18px; color: var(--muted); }
/* office + final */
.office { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px; max-width: 880px; margin: 0 auto; }
.office h4 { margin: 0 0 6px; font: 600 20px/1.25 var(--serif); } .office p { margin: 2px 0; color: var(--muted); }
.office .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.office .acts a { text-decoration: none; font-weight: 700; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line); }
.office .acts a.dir { background: var(--navy); color: #fff; border-color: var(--navy); }
.final { background: radial-gradient(700px 300px at 50% 0%, rgba(197,164,109,.18), transparent 70%), var(--navy); color: #fff; text-align: center; }
.final h2.t { color: #fff; } .final .head p { color: rgba(255,255,255,.75); }
.after { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 860px; margin: 0 auto 28px; text-align: left; }
.after div { border: 1px solid rgba(197,164,109,.3); border-radius: 14px; padding: 16px; font-size: 14.5px; color: rgba(255,255,255,.85); }
.after b { display: block; color: var(--gold); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.btn { display: inline-block; background: var(--gold); color: var(--navy); text-decoration: none; font-weight: 800; padding: 16px 28px; border-radius: 999px; }
footer { background: #0B1426; color: rgba(255,255,255,.65); padding: 26px 0 96px; font-size: 13px; text-align: center; }
footer a { color: rgba(255,255,255,.8); }
.sticky { display: none; position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 30; gap: 8px; }
.sticky a { flex: 1; text-align: center; text-decoration: none; font-weight: 800; padding: 15px 10px; border-radius: 999px; color: var(--navy); background: var(--gold); box-shadow: 0 12px 28px -10px rgba(0,0,0,.55); }
.sticky a.w { flex: 0 0 54px; background: #1FAF54; color: #fff; }
.skel { padding: 70px 16px; } .skel i { display: block; height: 16px; background: #ECE6D8; border-radius: 8px; margin: 12px auto; max-width: 520px; }
.closed { max-width: 560px; margin: 80px auto; text-align: center; padding: 0 20px; } .closed h1 { font-size: 26px; color: var(--navy); }
@media (max-width: 960px) {
  .road { grid-template-columns: 1fr; gap: 0; } .road::before { left: 23px; right: auto; top: 24px; bottom: 24px; width: 2px; height: auto; background: linear-gradient(180deg, var(--gold), rgba(197,164,109,.25)); }
  .rs { display: grid; grid-template-columns: 48px 1fr; column-gap: 16px; text-align: left; padding: 0 0 22px; } .rs::before { margin: 0; grid-row: 1 / span 3; }
  .elig { grid-template-columns: 1fr; } .after { grid-template-columns: 1fr; }
  .quote { flex-basis: 86%; }
}
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; grid-template-areas: "intro" "card" "more"; row-gap: 18px; padding-top: 22px; padding-bottom: 54px; }
  .intro .sub { font-size: 15.5px; margin-bottom: 0; } h1 { margin: 10px 0 10px; }
  .illus { display: none; }
  .impact { grid-template-columns: repeat(2, 1fr); } .impact div:nth-child(3) { border-left: 0; } .impact div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .services { grid-template-columns: 1fr 1fr; } .photos { grid-template-columns: repeat(2, 1fr); }
  .sticky.on { display: flex; }
  section.band { padding: 48px 0; }
}
@media (max-width: 560px) { .services { grid-template-columns: 1fr; } .card { padding: 20px 16px; } }
@media (max-width: 380px) { .opts.three { grid-template-columns: repeat(2, 1fr); } .top a.call { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

    '<section class="band final"><div class="wrap">' + head('Next step', 'Let’s explore your ' + esc(uk ? 'UK ' : '') + 'study options', 'Answer three quick questions and a counsellor will take it from there.') +
      '<div class="after"><div><b>1 · Today</b>You answer 3 questions on this page.</div><div><b>2 · Next</b>A counsellor from our ' + esc(c.branch || 'nearest') + ' branch calls you on WhatsApp.</div><div><b>3 · Then</b>You get a shortlist and a clear plan for ' + esc(c.intake || 'your intake') + '.</div></div>' +
      '<a class="btn" href="#form">' + esc(c.ctaText) + ' →</a></div></section>' +
    '<footer><div class="wrap">© ' + new Date().getFullYear() + ' Akbar Study Abroad · A vertical of Akbar Group' + (c.branch || (c.branches || []).length ? '<br>' + esc(c.branch ? c.branch + ' branch' : c.branches.join(' · ')) : '') + (c.privacyUrl ? '<br><a href="' + esc(c.privacyUrl) + '" target="_blank" rel="noopener">Privacy policy</a>' : '') + '</div></footer>' +
    '<div class="sticky" id="lpSticky"><a href="#form">' + esc(c.ctaText) + ' →</a>' + (wa ? '<a class="w" href="https://wa.me/' + esc(wa) + '" target="_blank" rel="noopener" aria-label="WhatsApp us">💬</a>' : '') + '</div>';
  drawStep(c);
  var stick = $('lpSticky');
  if ('IntersectionObserver' in window) new IntersectionObserver(function (en) { stick.classList.toggle('on', !en[0].isIntersecting); }, { threshold: 0.05 }).observe($('form'));
  carousel();
  pixel(c);
}
/* testimonials: swipe, dots, and a gentle auto-turn every 6 s (stops when the visitor touches it or prefers less motion) */
function carousel() {
  var tr = $('lpTrack'), dots = $('lpDots'); if (!tr || !dots) return;
  var items = tr.children, cur = 0, stop = false, timer;
  var go = function (i) { cur = (i + items.length) % items.length; tr.scrollTo({ left: items[cur].offsetLeft - tr.offsetLeft, behavior: 'smooth' }); };
  var mark = function () { var x = tr.scrollLeft, best = 0; for (var i = 0; i < items.length; i++) if (Math.abs(items[i].offsetLeft - tr.offsetLeft - x) < Math.abs(items[best].offsetLeft - tr.offsetLeft - x)) best = i; cur = best; [].forEach.call(dots.children, function (d, i) { d.setAttribute('aria-current', i === best ? 'true' : 'false'); }); };
  [].forEach.call(dots.children, function (d, i) { d.onclick = function () { stop = true; go(i); }; });
  tr.addEventListener('scroll', function () { clearTimeout(tr._t); tr._t = setTimeout(mark, 80); }, { passive: true });
  ['pointerdown', 'touchstart', 'focusin'].forEach(function (ev) { tr.addEventListener(ev, function () { stop = true; }, { passive: true }); });
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  timer = setInterval(function () { if (stop || document.hidden) return; var r = tr.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return; go(cur + 1); }, 6000);
}
function send(c) {
  var btn = $('lpGo'), err = $('lpErr'); err.textContent = '';
  var v = function (id) { var el = $(id); return el ? el.value.trim() : ''; };
  var name = v('f_name'), phone = v('f_phone').replace(/\D/g, ''), cc = v('f_cc').replace(/\D/g, '') || '91';
  if (name.length < 2) { err.textContent = 'Please enter your full name.'; $('f_name').focus(); return; }
  if (cc === '91') { phone = phone.replace(/^0+/, ''); if (phone.length === 12 && phone.indexOf('91') === 0) phone = phone.slice(2); }
  if (cc === '91' ? !/^[6-9]\d{9}$/.test(phone) : phone.length < 8) { err.textContent = 'Please enter a valid 10-digit WhatsApp number.'; $('f_phone').focus(); return; }
  if (c.branchMode === 'choose' && !v('f_branch')) { err.textContent = 'Please choose your nearest branch.'; $('f_branch').focus(); return; }
  var full = (cc === '91' && phone.length === 10) ? '91' + phone : cc + phone.replace(/^0+/, '');
  var eventId = 'lp.' + Date.now().toString(36) + '.' + Math.random().toString(36).slice(2, 8);
  var fbclid = qs.get('fbclid'), fbc = cookie('_fbc') || (fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : '');
  var p = { slug: c.slug, name: name, phone: full, email: v('f_email'), city: v('f_city'), country: S.a.country || '', level: S.a.level || '', intake: S.a.intake || '', education: S.a.education || '', budget: S.a.budget || '', test: S.a.test || '',
    branch: c.branchMode === 'choose' ? v('f_branch') : '', website: v('f_website'), ms: Date.now() - started, eventId: eventId, url: location.href.split('#')[0], ua: navigator.userAgent, fbp: cookie('_fbp'), fbc: fbc,
    utm: { source: qs.get('utm_source') || '', campaign: qs.get('utm_campaign') || '', adset: qs.get('utm_term') || qs.get('utm_adset') || '', ad: qs.get('utm_content') || qs.get('utm_ad') || '' } };
  btn.disabled = true; btn.textContent = 'Booking your call…';
  if (preview) { setTimeout(function () { thanks(c, { firstName: name.split(' ')[0], branch: c.branch || p.branch || 'nearest', whatsapp: c.whatsapp }, true); }, 500); return; }
  call('submitLandingLead', [p]).then(function (r) {
    try { var pid = c.pixels && c.pixels[r.branch]; if (window.fbq && pid) window.fbq('trackSingle', pid, 'Lead', { content_name: c.headline }, { eventID: eventId }); } catch (e) { }
    thanks(c, r, false);
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = c.ctaText + ' →'; err.textContent = e.message;
    if (c.whatsapp) { var a = document.createElement('a'); a.className = 'fallback'; a.target = '_blank'; a.rel = 'noopener'; a.href = 'https://wa.me/' + c.whatsapp + '?text=' + encodeURIComponent('Hi Akbar Study Abroad, I want counselling for ' + (S.a.country || c.country || 'studying abroad') + '. My name is ' + name + ', my number is ' + full + '.'); a.textContent = '💬 Send your details on WhatsApp instead'; err.appendChild(document.createElement('br')); err.appendChild(a); }
  });
}
function thanks(c, r, isPreview) {
  var wa = r.whatsapp ? 'https://wa.me/' + r.whatsapp + '?text=' + encodeURIComponent('Hi Akbar Study Abroad, I just booked a free counselling call for ' + (S.a.country || c.country || 'studying abroad') + (S.a.intake ? ' (' + S.a.intake + ')' : '') + '. My name is ' + (r.firstName || '') + '.') : '';
  $('lpBox').innerHTML = '<div class="done"><div class="ic">✓</div><h2>You’re booked, ' + esc(r.firstName || '') + '!</h2><p>' + esc(c.thankYou || ('A counsellor from our ' + r.branch + ' branch will call you on WhatsApp shortly. Keep your phone close!')) + '</p>' +
    (wa ? '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">💬 Chat with us on WhatsApp now</a>' : '') +
    '<a class="alt" href="' + ROOT + '/portal/" target="_blank" rel="noopener">Track your application in the student app →</a>' + (isPreview ? '<p class="small">Preview — nothing was saved.</p>' : '') + '</div>';
  var s = $('lpSticky'); if (s) s.remove();
  $('form').scrollIntoView({ block: 'start' });
}
if (window.LP_CONFIG) { render(window.LP_CONFIG); if (!preview) setTimeout(function () { call('lpPing', [slug]).catch(function () { }); }, 1500); }
else if (!slug) closed('This page link is not complete.');
else call('getLandingPage', [slug, preview]).then(render).catch(function (e) { closed(e.message); });
})();
