<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akbar Study Abroad</title>
<meta name="description" content="Free study-abroad counselling from Akbar Study Abroad — universities, scholarships and visas.">
<meta name="theme-color" content="#F22F3D">
<link rel="icon" href="../portal/icon-192.png">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<style>
:root { --brand: #F22F3D; --brand2: #B8121F; --ink: #15131D; --muted: #5C5F6E; --line: #E7E7EE; --soft: #F6F5F9; --ok: #128650; --card: #fff; --r: 16px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; color: var(--ink); background: #fff; line-height: 1.5; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
button, input, select { font: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.top { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; gap: 10px; }
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; font-weight: 800; font-size: 15px; line-height: 1.15; }
.logo img { width: 32px; height: 32px; border-radius: 8px; }
.logo small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
.top a.call { text-decoration: none; font-weight: 700; font-size: 14px; color: #fff; background: #1FAF54; padding: 9px 13px; border-radius: 10px; white-space: nowrap; }
.hero { background: linear-gradient(180deg, #FFF3F4 0%, #FFFFFF 78%); }
.hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; grid-template-areas: "intro card" "more card"; column-gap: 40px; padding-top: 34px; padding-bottom: 44px; align-items: start; }
.intro { grid-area: intro; } .more { grid-area: more; } .hero .card { grid-area: card; }
.badge { display: inline-block; background: #fff; color: var(--brand2); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid #F8C9CD; }
h1 { font-size: clamp(28px, 4.2vw, 46px); line-height: 1.1; letter-spacing: -.02em; margin: 14px 0 12px; font-weight: 800; }
h1 em { font-style: normal; color: var(--brand); }
.sub { font-size: clamp(16px, 1.5vw, 18px); color: var(--muted); margin: 0 0 18px; max-width: 560px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
.chips li { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 14px; font-weight: 600; }
.ticks { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 10px; }
.ticks li { position: relative; padding-left: 32px; font-size: 16px; }
.ticks li::before { content: '✓'; position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; line-height: 22px; text-align: center; }
.heroimg { width: 100%; height: auto; aspect-ratio: 16/10; object-fit: cover; border-radius: 18px; background: var(--soft); }
.illus { width: 100%; height: auto; border-radius: 18px; }
/* quiz card */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: 0 18px 40px -26px rgba(25,10,35,.45); }
.card h2 { margin: 0 0 2px; font-size: 20px; line-height: 1.25; }
.card .hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.prog { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.prog .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; transition: width .25s ease; }
.q { font-weight: 800; font-size: 16px; margin: 4px 0 10px; }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 0 14px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; background: #fff; line-height: 1.25; }
.opt .fl { font-size: 20px; line-height: 1; }
.opt input:checked + span { border-color: var(--brand); background: #FFF2F3; color: var(--brand2); box-shadow: inset 0 0 0 1px var(--brand); }
.opt input:focus-visible + span { outline: 3px solid #F9B4BA; outline-offset: 1px; }
.f { margin-bottom: 12px; }
.f label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
.f input, .f select { width: 100%; height: 50px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: #fff; color: var(--ink); }
.f input:focus, .f select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px #FBD3D6; }
.phone { display: flex; gap: 8px; } .phone .cc { flex: 0 0 72px; text-align: center; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.nav { display: flex; gap: 8px; align-items: center; }
.back { border: 0; background: none; color: var(--muted); font-weight: 700; padding: 0 10px; height: 52px; cursor: pointer; }
button.go { flex: 1; height: 54px; border: 0; border-radius: 13px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 800; cursor: pointer; }
button.go:active { transform: translateY(1px); }
button.go:disabled { opacity: .65; }
.err { color: #B4141F; font-size: 14px; font-weight: 600; margin: 8px 0 0; }
.small { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; text-align: center; }
.done { text-align: center; padding: 8px 0; }
.done .ic { width: 60px; height: 60px; border-radius: 50%; background: #E3F5EC; color: var(--ok); display: grid; place-items: center; margin: 0 auto 12px; font-size: 30px; font-weight: 800; }
.done h2 { font-size: 22px; } .done p { color: var(--muted); }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 13px; background: #1FAF54; color: #fff; text-decoration: none; font-weight: 800; margin-top: 12px; padding: 0 14px; }
.alt { display: block; margin-top: 12px; font-weight: 700; color: var(--brand2); text-decoration: none; }
/* sections */
section.band { padding: 46px 0; content-visibility: auto; contain-intrinsic-size: 1px 520px; }
section.soft { background: var(--soft); }
h3.t { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; margin: 0 0 22px; text-align: center; letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 18px; text-align: center; }
.stat b { display: block; font-size: 28px; color: var(--brand); font-weight: 800; }
.stat span { color: var(--muted); font-size: 14px; font-weight: 600; }
.photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.photos img { width: 100%; height: auto; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px; background: #E9E8EF; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; counter-reset: s; }
.step { padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: #fff; }
.step::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff; font-weight: 800; margin-bottom: 10px; }
.step b { display: block; font-size: 16px; margin-bottom: 3px; } .step span { color: var(--muted); font-size: 14.5px; }
.quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.quote { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 18px; font-size: 15px; }
.quote b { display: block; margin-top: 10px; font-size: 14px; }
.faq { max-width: 760px; margin: 0 auto; }
.faq details { border: 1px solid var(--line); border-radius: 14px; background: #fff; margin-bottom: 10px; }
.faq summary { cursor: pointer; padding: 15px 44px 15px 16px; font-weight: 700; list-style: none; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; position: absolute; right: 16px; top: 10px; font-size: 22px; color: var(--brand); font-weight: 700; }
.faq details[open] summary::after { content: '−'; }
.faq p { margin: 0; padding: 0 16px 16px; color: var(--muted); }
.final { text-align: center; } .final .sub { margin: 0 auto 14px; }
.btn { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; font-weight: 800; padding: 15px 24px; border-radius: 13px; }
footer { border-top: 1px solid var(--line); padding: 22px 0 92px; color: var(--muted); font-size: 13px; text-align: center; }
.sticky { display: none; position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 30; gap: 8px; }
.sticky a { flex: 1; text-align: center; text-decoration: none; font-weight: 800; padding: 14px 10px; border-radius: 13px; color: #fff; background: var(--brand); box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); }
.sticky a.w { flex: 0 0 auto; background: #1FAF54; }
.skel { padding: 70px 16px; } .skel i { display: block; height: 16px; background: #EEEDF3; border-radius: 8px; margin: 12px auto; max-width: 520px; }
.closed { max-width: 560px; margin: 80px auto; text-align: center; padding: 0 20px; } .closed h1 { font-size: 26px; }
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; grid-template-areas: "intro" "card" "more"; row-gap: 16px; padding-top: 16px; padding-bottom: 28px; }
  .intro .sub { display: none; } h1 { margin: 10px 0 0; }
  .illus, .ticks.desk { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); } .quotes, .steps { grid-template-columns: 1fr; } .photos { grid-template-columns: repeat(2, 1fr); }
  .sticky.on { display: flex; }
}
@media (max-width: 380px) { .opts.three { grid-template-columns: repeat(2, 1fr); } .top a.call { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>

function intakes() { var out = [], d = new Date(), M = ['Jan', 'May', 'Sep']; for (var y = d.getFullYear(); y <= d.getFullYear() + 2; y++) M.forEach(function (m, i) { if (new Date(y, [0, 4, 8][i], 1) > d) out.push(m + ' ' + y); }); return out.slice(0, 5); }
var FLAG = { 'United Kingdom': '🇬🇧', 'Ireland': '🇮🇪', 'Canada': '🇨🇦', 'Australia': '🇦🇺', 'USA': '🇺🇸', 'Germany': '🇩🇪', 'France': '🇫🇷', 'New Zealand': '🇳🇿', 'Dubai / UAE': '🇦🇪', 'Europe (other)': '🇪🇺', 'Not decided yet': '🌍' };

};

function buildSteps(c) {

    '<section class="hero"><div class="wrap"><div class="intro">' +

      '<h1>' + esc(c.headline) + '</h1>' + (c.subhead ? '<p class="sub">' + esc(c.subhead) + '</p>' : '') + '</div><div class="more">' +

function send(c) {
  var btn = $('lpGo'), err = $('lpErr'); err.textContent = '';
  var v = function (id) { var el = $(id); return el ? el.value.trim() : ''; };
  var name = v('f_name'), phone = v('f_phone').replace(/\D/g, ''), cc = v('f_cc').replace(/\D/g, '') || '91';
  if (name.length < 2) { err.textContent = 'Please enter your full name.'; $('f_name').focus(); return; }
  if (phone.length < 8) { err.textContent = 'Please enter your WhatsApp number.'; $('f_phone').focus(); return; }
  if (c.branchMode === 'choose' && !v('f_branch')) { err.textContent = 'Please choose your nearest branch.'; $('f_branch').focus(); return; }
  var full = (cc === '91' && phone.length === 10) ? '91' + phone : cc + phone.replace(/^0+/, '');
  var eventId = 'lp.' + Date.now().toString(36) + '.' + Math.random().toString(36).slice(2, 8);
  var fbclid = qs.get('fbclid'), fbc = cookie('_fbc') || (fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : '');
  var p = { slug: c.slug, name: name, phone: full, email: v('f_email'), city: v('f_city'), country: S.a.country || '', level: S.a.level || '', intake: S.a.intake || '', education: S.a.education || '', budget: S.a.budget || '', test: S.a.test || '',
    branch: c.branchMode === 'choose' ? v('f_branch') : '', website: v('f_website'), ms: Date.now() - started, eventId: eventId, url: location.href.split('#')[0], ua: navigator.userAgent, fbp: cookie('_fbp'), fbc: fbc,
    utm: { source: qs.get('utm_source') || '', campaign: qs.get('utm_campaign') || '', adset: qs.get('utm_term') || qs.get('utm_adset') || '', ad: qs.get('utm_content') || qs.get('utm_ad') || '' } };
  btn.disabled = true; btn.textContent = 'Booking your call…';
  if (preview) { setTimeout(function () { thanks(c, { firstName: name.split(' ')[0], branch: c.branch || p.branch || 'nearest', whatsapp: c.whatsapp }, true); }, 500); return; }
  call('submitLandingLead', [p]).then(function (r) {
    try { var pid = c.pixels && c.pixels[r.branch]; if (window.fbq && pid) window.fbq('trackSingle', pid, 'Lead', { content_name: c.headline }, { eventID: eventId }); } catch (e) { }
    thanks(c, r, false);
  }).catch(function (e) { btn.disabled = false; btn.textContent = c.ctaText + ' →'; err.textContent = e.message; });
}
function thanks(c, r, isPreview) {
  var wa = r.whatsapp ? 'https://wa.me/' + r.whatsapp + '?text=' + encodeURIComponent('Hi Akbar Study Abroad, I just booked a free counselling call for ' + (S.a.country || c.country || 'studying abroad') + (S.a.intake ? ' (' + S.a.intake + ')' : '') + '. My name is ' + (r.firstName || '') + '.') : '';
  $('lpBox').innerHTML = '<div class="done"><div class="ic">✓</div><h2>You’re booked, ' + esc(r.firstName || '') + '!</h2><p>' + esc(c.thankYou || ('A counsellor from our ' + r.branch + ' branch will call you on WhatsApp shortly. Keep your phone close!')) + '</p>' +
    (wa ? '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">💬 Chat with us on WhatsApp now</a>' : '') +
    '<a class="alt" href="' + ROOT + '/portal/" target="_blank" rel="noopener">Track your application in the student app →</a>' + (isPreview ? '<p class="small">Preview — nothing was saved.</p>' : '') + '</div>';
  var s = $('lpSticky'); if (s) s.remove();
  $('form').scrollIntoView({ block: 'start' });
}
if (window.LP_CONFIG) { render(window.LP_CONFIG); if (!preview) setTimeout(function () { call('lpPing', [slug]).catch(function () { }); }, 1500); }
else if (!slug) closed('This page link is not complete.');
else call('getLandingPage', [slug, preview]).then(render).catch(function (e) { closed(e.message); });
})();
