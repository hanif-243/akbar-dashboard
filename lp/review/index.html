<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share your story – Akbar Study Abroad</title>
<meta name="description" content="Studied abroad with Akbar Study Abroad? Share your experience to help the next student.">
<meta name="theme-color" content="#F22F3D">
<link rel="icon" href="../../portal/icon-192.png">
<style>
:root { --a: #F22F3D; --a2: #B8121F; --ink: #15131D; --muted: #5C5F6E; --line: #E8E4E8; --bg: #FFF6F7; --ok: #128650; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.55; }
.top { background: #fff; border-bottom: 1px solid var(--line); }
.top .w { max-width: 680px; margin: 0 auto; padding: 0 18px; height: 58px; display: flex; align-items: center; gap: 10px; font-weight: 800; }
.top img { width: 32px; height: 32px; border-radius: 8px; } .top small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
main { max-width: 680px; margin: 0 auto; padding: 30px 18px 60px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: 0 30px 60px -40px rgba(30,10,40,.4); border-top: 4px solid var(--a); }
h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -.02em; }
.sub { color: var(--muted); margin: 0 0 20px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f { margin-bottom: 14px; }
label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
input, select, textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; height: 50px; font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
textarea { height: auto; min-height: 130px; padding: 12px 14px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--a); box-shadow: 0 0 0 3px #FBD3D6; }
.count { text-align: right; font-size: 12px; color: var(--muted); margin-top: 3px; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
.consent input { width: 20px; height: 20px; flex: 0 0 auto; margin-top: 2px; }
.hp { position: absolute; left: -9999px; }
button { width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--a); color: #fff; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: #B4141F; font-weight: 600; font-size: 14px; margin: 10px 0 0; }
.done { text-align: center; padding: 20px 0; } .done .ic { font-size: 46px; } .done h1 { margin-top: 8px; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top"><div class="w"><img src="../../portal/icon-192.png" alt="" width="32" height="32"><span>Akbar Study Abroad<small>A vertical of Akbar Group</small></span></div></header>
<main><div class="card" id="box">
<h1>Share your story 🎓</h1>
<p class="sub">Studied abroad with Akbar Study Abroad? A few lines about your experience help the next student take their first step. It takes one minute.</p>
<form id="f" novalidate>
<div class="two"><div class="f"><label for="n">Your name *</label><input id="n" autocomplete="name"></div><div class="f"><label for="c">Your home city</label><input id="c" autocomplete="address-level2"></div></div>
<div class="two"><div class="f"><label for="u">University</label><input id="u" placeholder="e.g. University of Hertfordshire"></div><div class="f"><label for="co">Country</label><select id="co"><option value="">Choose…</option><option>United Kingdom</option><option>Ireland</option><option>Canada</option><option>Australia</option><option>USA</option><option>Germany</option><option>France</option><option>New Zealand</option><option>Dubai / UAE</option><option>Other</option></select></div></div>
<div class="two"><div class="f"><label for="b">Which Akbar branch helped you?</label><select id="b"><option value="">Choose…</option></select></div><div class="f"><label for="ph">WhatsApp number <span style="font-weight:500;color:var(--muted)">(private, not shown)</span></label><input id="ph" type="tel" inputmode="tel"></div></div>
<div class="f"><label for="q">Your experience *</label><textarea id="q" maxlength="500" placeholder="What did Akbar Study Abroad help you with? How was your counsellor? How is life abroad?"></textarea><div class="count" id="cnt">0 / 500</div></div>
<label class="consent"><input type="checkbox" id="ok"><span>I agree that Akbar Study Abroad may show my first name, city, university and this story on its website and adverts. My phone number is never shown.</span></label>
<div class="hp" aria-hidden="true"><input id="w" tabindex="-1" autocomplete="off"></div>
<button id="go" type="submit">Share my story</button><p class="err" id="e" role="alert"></p>
</form></div></main>
<script>
(function () {
var API = 'https://script.google.com/macros/s/AKfycbx6CcjiRhhaqd5hn--2GQDRs1a3ZcnrCQl8srQr7plBffWzrCXmpg07FF77b_PKz0d8yw/exec', started = Date.now(), $ = function (id) { return document.getElementById(id); };
var q = new URLSearchParams(location.search), pre = q.get('b') || '';
function call(fn, args) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' }).then(function (r) { return r.text(); }).then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Our server is busy — please try again in a moment.'); } if (!j.ok) throw new Error(j.e || 'Something went wrong.'); return j.v; }); }
var addB = function (list) { var s = $('b'); list.forEach(function (b) { var o = document.createElement('option'); o.textContent = b; if (b === pre) o.selected = true; s.appendChild(o); }); };
call('getStudentAppInfo', []).then(function (r) { addB(r && r.branches && r.branches.length ? r.branches : (pre ? [pre] : [])); }).catch(function () { addB(pre ? [pre] : []); });
$('q').oninput = function () { $('cnt').textContent = $('q').value.length + ' / 500'; };
$('f').onsubmit = function (ev) {
  ev.preventDefault(); var e = $('e'); e.textContent = '';
  var p = { name: $('n').value, city: $('c').value, university: $('u').value, country: $('co').value, branch: $('b').value, phone: $('ph').value, quote: $('q').value, consent: $('ok').checked, website: $('w').value, ms: Date.now() - started };
  if (p.name.trim().length < 2) { e.textContent = 'Please enter your name.'; return; }
  if (p.quote.trim().length < 20) { e.textContent = 'Please write at least a sentence or two.'; return; }
  if (!p.consent) { e.textContent = 'Please tick the box to let us show your story.'; return; }
  $('go').disabled = true; $('go').textContent = 'Sending…';
  call('submitStudentReview', [p]).then(function () { $('box').innerHTML = '<div class="done"><div class="ic">💛</div><h1>Thank you, ' + p.name.split(' ')[0].replace(/[<>&"]/g, '') + '!</h1><p class="sub">Your story will help the next student take their first step.</p></div>'; })
    .catch(function (x) { $('go').disabled = false; $('go').textContent = 'Share my story'; e.textContent = x.message; });
};
})();
</script>
</body>
</html>
