<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your course shortlist</title>
<meta name="description" content="The courses your counsellor picked for you. Tap the ones you like.">
<meta property="og:title" content="Your course shortlist">
<meta property="og:description" content="The courses your counsellor picked for you at Akbar Study Abroad. Tap the ones you like.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hanif-243.github.io/akbar-dashboard/lp/checklist/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#151A35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* v185 STUDENT SHORTLIST LINK: the courses a counsellor picked, with "I like this" on each */
:root { --c: #E2231A; --d: #151A35; --ink: #17142A; --mut: #6B6478; --line: #ECE8F2; --bg: #F5F3F9; --ok: #12925A; --card: #fff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.hero { background: var(--d); color: #fff; padding: 20px 20px 72px; }
.hero .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px; margin: 0 auto; }
.hero img { height: 30px; width: auto; display: block; }
.hero .tag { font-size: 12px; color: rgba(255,255,255,.7); }
.hero h1 { font: 600 28px/1.2 Fraunces, Georgia, serif; margin: 28px auto 6px; max-width: 760px; }
.hero p { margin: 0 auto; max-width: 760px; color: rgba(255,255,255,.78); font-size: 14px; line-height: 1.5; }
main { max-width: 760px; margin: -52px auto 0; padding: 0 16px 120px; }
.sum { background: var(--card); border-radius: 18px; padding: 16px 18px; display: flex; gap: 20px; flex-wrap: wrap; box-shadow: 0 1px 2px rgba(20,20,40,.06); }
.sum div { min-width: 90px; }
.sum b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum span { font-size: 12.5px; color: var(--mut); }
.card { background: var(--card); border-radius: 18px; padding: 18px; margin-top: 12px; border: 1px solid transparent; box-shadow: 0 1px 2px rgba(20,20,40,.06); transition: border-color .15s; }
.card.on { border-color: var(--ok); }
.uni { font-weight: 600; font-size: 16px; }
.qs { font-size: 12px; color: var(--mut); font-weight: 500; margin-left: 6px; }
.deg { margin-top: 4px; font-size: 14.5px; }
.camp { font-size: 12.5px; color: var(--mut); margin-top: 2px; }
.why { font-size: 13px; margin-top: 8px; color: var(--ink); }
.why b { color: var(--mut); font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.facts div span { display: block; font-size: 11.5px; color: var(--mut); }
.facts div b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dl { margin-top: 10px; font-size: 13px; }
.dl.soon b { color: var(--c); }
.dl small { color: var(--mut); }
.acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.like[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--d); outline-offset: 2px; }
.btn[disabled] { opacity: .6; cursor: default; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.bar .t { font-size: 13px; color: var(--mut); }
.bar .go { background: var(--c); color: #fff; border-color: var(--c); }
.note { font-size: 12px; color: var(--mut); margin-top: 18px; line-height: 1.5; }
.msg { background: var(--card); border-radius: 18px; padding: 28px 20px; text-align: center; margin-top: 12px; }
.sk { background: linear-gradient(90deg, #ece9f2, #f6f4fa, #ece9f2); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 18px; height: 150px; margin-top: 12px; }
@keyframes sk { to { background-position: -200% 0; } }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px); opacity: 0; background: var(--d); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; transition: .25s; z-index: 9; max-width: 90vw; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--c); }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .toast { transition: none; } }
</style>
</head>
<body>
<div class="hero"><div class="top"><span id="logo"></span><span class="tag">Akbar Study Abroad</span></div><h1>Your course shortlist</h1><p id="sub">Loading your courses…</p></div>
<main id="app"><div class="sk"></div><div class="sk"></div></main>
<div class="bar" id="bar" hidden><div class="in"><span class="t" id="barT"></span><a class="btn go" id="talk" target="_blank" rel="noopener">Talk to my counsellor</a></div></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzM25HLBhuI36dn-uUgdTUoXiiTXABMBNDuaBMGjC_SUUU9eueVPn35lFowwBIqb1XNTw/exec';
  var KEY = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app'), D = null, busy = false;
  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function api(fn, args) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
      .then(function (r) { return r.text(); }).then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Our server is busy. Please try again in a moment.'); } if (!j.ok) throw new Error(j.e || 'Something went wrong'); return j.v; });
  }
  function toast(m, bad) {
    var t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('on'); }); setTimeout(function () { t.classList.remove('on'); setTimeout(function () { t.remove(); }, 300); }, 3200);
  }
  function fd(ymd) { var p = String(ymd || '').slice(0, 10).split('-'); if (p.length < 3) return ''; return Number(p[2]) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(p[1]) - 1] + ' ' + p[0]; }
  function len(m) { m = Number(m); if (!m) return ''; return m % 12 === 0 ? (m / 12) + (m > 12 ? ' years' : ' year') : m + ' months'; }
  function waUrl(phone, text) {
    var p = String(phone || '').replace(/\D/g, ''); if (p.length === 10) p = '91' + p;
    return 'https:' + '//wa.me/' + p + '?text=' + encodeURIComponent(text);
  }
  function render() {
    var liked = D.items.filter(function (x) { return x.picked; });
    document.getElementById('sub').textContent = (D.first ? 'Hi ' + D.first + '. ' : '') + 'These ' + D.items.length + ' courses in ' + D.country + ' were picked for you' + (D.by ? ' by ' + D.by : '') + '. Tap "I like this" on the ones you want to apply to.';
    if (D.brand && D.brand.logo && !document.querySelector('#logo img')) { var im = document.createElement('img'); im.src = D.brand.logo; im.alt = D.brand.name || 'Akbar Study Abroad'; document.getElementById('logo').appendChild(im); }
    var h = '<div class="sum"><div><b>' + D.items.length + '</b><span>Courses picked for you</span></div><div><b>' + liked.length + '</b><span>You like</span></div><div><b>' + esc(D.country) + '</b><span>Country</span></div></div>';
    D.items.forEach(function (x) {
      var f = [];
      if (x.fee) f.push(['Tuition a year', x.fee]);
      if (x.firstYear) f.push(['First year with living costs', x.firstYear]);
      if (x.ielts != null && x.ielts !== '') f.push(['IELTS asked', x.ielts]);
      if (x.intake) f.push(['Intake', x.intake]);
      if (len(x.months)) f.push(['Length', len(x.months)]);
      var d = x.deadline;
      h += '<div class="card' + (x.picked ? ' on' : '') + '"><div class="uni">' + esc(x.uni) + (x.qs != null && x.qs !== '' ? '<span class="qs">QS ' + esc(x.qs) + '</span>' : '') + '</div>' +
        '<div class="deg">' + esc(x.degree) + '</div>' + (x.campus ? '<div class="camp">' + esc(x.campus) + '</div>' : '') +
        (x.why ? '<div class="why"><b>Why it fits: </b>' + esc(x.why) + '</div>' : '') +
        (f.length ? '<div class="facts">' + f.map(function (p) { return '<div><span>' + esc(p[0]) + '</span><b>' + esc(p[1]) + '</b></div>'; }).join('') + '</div>' : '') +
        (d ? '<div class="dl' + (d.days <= 30 ? ' soon' : '') + '">Apply by <b>' + esc(fd(d.ymd)) + '</b> · ' + (d.days === 0 ? 'today' : d.days + ' day' + (d.days === 1 ? '' : 's') + ' left') + (d.intake ? ' for the ' + esc(d.intake) + ' intake' : '') + (d.est ? ' <small>(usual yearly date, we confirm it with the university)</small>' : '') + '</div>' : '') +
        '<div class="acts"><button type="button" class="btn like" data-i="' + x.i + '" aria-pressed="' + (x.picked ? 'true' : 'false') + '">' + (x.picked ? 'You like this' : 'I like this') + '</button>' +
        (x.link ? '<a class="btn" href="' + esc(x.link) + '" target="_blank" rel="noopener">Course page</a>' : '') + '</div></div>';
    });
    h += '<div class="note">Fees, intakes and deadlines come from our course list. Your counsellor confirms them with the university before you apply.</div>';
    app.innerHTML = h;
    var bar = document.getElementById('bar'), talk = document.getElementById('talk');
    document.getElementById('barT').textContent = liked.length ? 'You like ' + liked.length + ' course' + (liked.length === 1 ? '' : 's') : 'Questions about a course?';
    if (D.brand && D.brand.phone) {
      talk.href = waUrl(D.brand.phone, 'Hi, I looked at my course shortlist' + (liked.length ? '. I like: ' + liked.map(function (x) { return x.uni + ' (' + x.degree + ')'; }).join('; ') : '') + '.');
      bar.hidden = false;
    } else bar.hidden = true;
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('.like'); if (!b || busy) return;
    var i = Number(b.getAttribute('data-i')), on = b.getAttribute('aria-pressed') !== 'true';
    busy = true; b.disabled = true;
    api('pickSharedShortlist', [KEY, i, on]).then(function (v) { D = v; render(); if (on) toast('Saved. Your counsellor can see it.'); })
      .catch(function (err) { b.disabled = false; toast(err.message, true); }).then(function () { busy = false; });
  });
  if (!KEY) { app.innerHTML = '<div class="msg">This link is not complete. Ask your counsellor to send it again.</div>'; document.getElementById('sub').textContent = ''; return; }
  api('getSharedShortlist', [KEY]).then(function (v) { D = v; render(); })
    .catch(function (err) { document.getElementById('sub').textContent = ''; app.innerHTML = '<div class="msg">' + esc(err.message) + '</div>'; });
})();
</script>
</body>
</html>
