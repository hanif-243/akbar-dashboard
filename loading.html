<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akbar Study Abroad · Lead Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* v204: boarding pass. The plane moves along the route while the dashboard loads; when it is ready the pass is stamped "Boarded" and the stub tears off. */
:root { --ink: #12172B; --muted: #6B7280; --line: #D5D9E3; --red: #F22F3D;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; --sans: 'IBM Plex Sans', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: radial-gradient(60% 70% at 50% 40%, #1E2440 0%, #12172B 72%); color: var(--ink); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; overflow: hidden; display: grid; place-items: center; padding: 24px 16px; }
body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 18px 18px; pointer-events: none; }
main { position: relative; width: min(600px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) 156px; filter: drop-shadow(0 24px 40px rgba(0,0,0,.45)); animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.pass { position: relative; background: #fff; border-radius: 16px 0 0 16px; min-width: 0; }
.pass::before, .pass::after { content: ''; position: absolute; right: -11px; width: 22px; height: 22px; border-radius: 50%; background: #171C33; z-index: 3; }
.pass::before { top: -11px; } .pass::after { bottom: -11px; }
.strip { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 20px; background: var(--ink); border-bottom: 3px solid var(--red); border-radius: 16px 0 0 0; }
.strip img { width: 104px; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
.strip .lt { display: none; font: 700 16px/1 var(--mono); letter-spacing: .14em; color: #fff; } .strip .lt b { color: var(--red); }
.strip span.cap { font: 600 10.5px/1 var(--mono); letter-spacing: .14em; color: rgba(255,255,255,.8); white-space: nowrap; }
.body { padding: 20px 20px 22px; }
.k { font: 600 9.5px/1 var(--mono); letter-spacing: .12em; color: var(--muted); margin-bottom: 6px; }
.hello { font: 600 26px/1.1 var(--sans); }
.route { display: flex; align-items: flex-end; gap: 12px; margin: 22px 0 16px; }
.v { font: 600 20px/1 var(--sans); }
.ln { flex: 1; height: 0; border-top: 2px dotted #C9CDD8; position: relative; margin-bottom: 9px; }
.ln i { position: absolute; left: 0; top: -2px; height: 2px; width: 0; background: var(--red); transition: width .5s ease; }
.ln svg { position: absolute; top: -9px; left: 0; margin-left: -9px; transition: left .5s ease; }
.status { display: flex; justify-content: space-between; gap: 12px; font: 500 12.5px/1.4 var(--sans); color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; transition: opacity .2s ease; }
.stub { position: relative; background: #fff; border-radius: 0 16px 16px 0; border-left: 2px dashed var(--line); padding: 18px 16px; display: flex; flex-direction: column; transform-origin: 0 0; }
.stub .gv { font: 600 17px/1.2 var(--sans); }
.bars { flex: 1; min-height: 80px; margin: 14px 0; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px); }
.stub .st { font: 600 10px/1.3 var(--mono); letter-spacing: .12em; text-align: center; }
.stamp { position: absolute; right: 186px; top: 78px; z-index: 4; transform: rotate(-12deg); border: 3px solid var(--red); color: var(--red); border-radius: 8px; padding: 6px 10px;
  font: 700 15px/1.1 var(--mono); letter-spacing: .08em; text-align: center; background: rgba(255,255,255,.7); opacity: 0; pointer-events: none; }
.stamp small { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .12em; margin-top: 3px; }
body.ready .stamp { animation: thump .35s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes thump { 0% { opacity: 0; transform: rotate(-12deg) scale(1.8); } 100% { opacity: .92; transform: rotate(-12deg) scale(1); } }
body.ready .stub { animation: tear .55s .25s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes tear { to { transform: translate(22px, 12px) rotate(7deg); } }
.foot { position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom)); text-align: center; font: 500 10.5px/1 var(--mono); letter-spacing: .16em; color: rgba(255,255,255,.3); }
body.done main { animation: none; transition: opacity .45s ease, transform .45s ease; opacity: 0; transform: scale(.985); }
@media (max-width: 620px) {
  main { grid-template-columns: minmax(0, 1fr); max-width: 420px; }
  .stub { display: none; } .pass { border-radius: 16px; } .strip { border-radius: 16px 16px 0 0; } .pass::before, .pass::after { display: none; }
  .strip span.cap { display: none; } .stamp { right: 18px; } .hello { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { main { animation: none; } body.ready .stamp { animation: none; opacity: .92; } body.ready .stub { animation: none; } .ln i, .ln svg { transition: none; } }
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="pass">
    <div class="strip"><img id="logo" src="portal/logo.png" alt="Akbar Study Abroad"><div class="lt" id="logoText">AKB<b>A</b>R</div><span class="cap">BOARDING PASS · LEAD OPS</span></div>
    <div class="body">
      <div class="k">PASSENGER</div>
      <div class="hello" id="hello">Welcome back</div>
      <div class="route" aria-hidden="true">
        <div><div class="k">FROM</div><div class="v">IND</div></div>
        <div class="ln"><i id="trail"></i><svg id="plane" width="18" height="18" viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M2 13l8-2 4-8h2l-2 8 6-1 2-3h2l-1 5 1 5h-2l-2-3-6-1 2 8h-2l-4-8-8-2z" fill="#12172B"/></svg></div>
        <div style="text-align:right"><div class="k">TO</div><div class="v">ADMIT</div></div>
      </div>
      <div class="status"><b id="status">Signing you in…</b><span id="clock">--:--</span></div>
    </div>
  </div>
  <div class="stub" aria-hidden="true"><div class="k">GATE</div><div class="gv">Lead Ops</div><div class="bars"></div><div class="st" id="gate">BOARDING</div></div>
  <div class="stamp" id="stamp" aria-hidden="true">BOARDED<small id="stampDate"></small></div>
</main>
<div class="foot">AKBAR STUDY ABROAD · LEAD OPS</div>
<script>
(function () {
  'use strict';
  var embedded = /[?&]embed=1/.test(location.search);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STEPS = ['Signing you in…', 'Loading your leads…', 'Getting follow-ups ready…', 'Checking what needs a call today…', 'Almost there…'];
  var statusEl = document.getElementById('status'), trail = document.getElementById('trail'), plane = document.getElementById('plane');

  var logo = document.getElementById('logo');
  logo.onerror = function () { logo.style.display = 'none'; document.getElementById('logoText').style.display = 'block'; };
  var now = new Date(), h = now.getHours(), M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('hello').textContent = h < 5 ? 'Welcome back' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('stampDate').textContent = now.getDate() + ' ' + M[now.getMonth()] + ' ' + now.getFullYear();
  function clock() { var d = new Date(); document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  clock(); setInterval(clock, 15000);

  function fly(p) { p = Math.max(0, Math.min(1, p)); trail.style.width = (p * 100) + '%'; plane.style.left = (p * 100) + '%'; }
  var start = Date.now(), step = -1, finishing = false, ended = false, timer;
  function setStep(i) {
    if (i === step || i >= STEPS.length) return; step = i; statusEl.style.opacity = 0;
    setTimeout(function () { statusEl.textContent = STEPS[i]; statusEl.style.opacity = 1; }, 160);
  }
  function tick() {
    var t = (Date.now() - start) / 1000;
    setStep(Math.min(STEPS.length - 1, Math.floor(t / 1.6)));
    fly(0.85 * (1 - Math.exp(-t / 3.2))); // eases towards 85% and waits there for the dashboard
  }
  timer = setInterval(tick, 200); tick();

  function finish() {
    if (finishing) return; finishing = true; clearInterval(timer);
    fly(1); statusEl.textContent = 'Ready'; document.getElementById('gate').textContent = 'GATE OPEN';
    setTimeout(function () { document.body.classList.add('ready'); }, reduce ? 0 : 450);
    setTimeout(done, reduce ? 300 : 1250);
  }
  function done() {
    if (ended) return; ended = true;
    document.body.classList.add('done');
    try { if (embedded) parent.postMessage('akbar:intro-done', '*'); } catch (e) { /* not in a frame */ }
    if (!embedded) setTimeout(function () { location.reload(); }, 1600); // opened on its own: loop the preview
  }

  window.AkbarLoader = { finish: finish };
  addEventListener('message', function (e) { if (e.data === 'akbar:finish') finish(); });
  if (embedded) { try { parent.postMessage('akbar:hello', '*'); } catch (e) { /* not in a frame */ } }
  else setTimeout(finish, 6500);
})();
</script>
</body>
</html>
