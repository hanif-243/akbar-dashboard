<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akbar Study Abroad · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --red:#F22F3D; --navy:#302D40; --bg:#09080f; --surface:#181526;
  --ok:#1F9D63; --warm:#D98A1F;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background .6s ease}
body.light{background:#F3F4FA}
button{font:inherit;cursor:pointer}
:focus-visible{outline:1.5px solid var(--red);outline-offset:3px}

/* ───────── LOADER SHELL ───────── */
#loader{position:fixed;inset:0;z-index:10;transition:opacity .6s ease}
#loader.gone{opacity:0;pointer-events:none}
.glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px circle at 50% 47%,rgba(242,47,61,.11),rgba(242,47,61,.03) 45%,transparent 70%);
  animation:breathe 5s ease-in-out infinite}
.dots{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 10%,transparent 75%);
          mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 10%,transparent 75%)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}

.br{position:absolute;width:18px;height:18px;border:0 solid rgba(242,47,61,.42);pointer-events:none}
.br.k1{top:20px;left:20px;border-top-width:1px;border-left-width:1px}
.br.k2{top:20px;right:20px;border-top-width:1px;border-right-width:1px}
.br.k3{bottom:20px;left:20px;border-bottom-width:1px;border-left-width:1px}
.br.k4{bottom:20px;right:20px;border-bottom-width:1px;border-right-width:1px}
.corner{position:absolute;top:26px;font:400 10px/1 var(--mono);letter-spacing:2px;color:rgba(255,255,255,.34);white-space:nowrap}
.corner.l{left:48px}
.corner.r{right:48px;font-variant-numeric:tabular-nums}
.corner.l i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:9px;vertical-align:1px;box-shadow:0 0 8px rgba(242,47,61,.9);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

.stage{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;
  transition:opacity .6s ease,visibility 0s linear .6s,transform .8s var(--ease)}
.stage.on{opacity:1;visibility:visible;transition:opacity .6s ease,visibility 0s}
.stage.on.leave{opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .5s ease,visibility 0s linear .5s,transform .6s var(--ease)}

/* ───────── STAGE 1 · LOGO ───────── */
.s1-wrap{display:flex;flex-direction:column;align-items:center;margin-top:-20px}
.logo-slot{opacity:0;transform:translateY(14px);transition:opacity 1.1s var(--ease) .15s,transform 1.1s var(--ease) .15s}
.s1.on .logo-slot{opacity:1;transform:none}
.logo{display:block;width:min(230px,58vw);height:auto;mix-blend-mode:screen;user-select:none;-webkit-user-drag:none}
/* White-background PNG: invert flips white→black (which screen removes) and navy→light;
   hue-rotate restores the red hue. Set CONFIG.logoMode='transparent' for a transparent PNG/SVG. */
.logo.invert{filter:invert(1) hue-rotate(180deg) saturate(1.25) contrast(1.05)}
.wordmark{display:block;width:min(230px,58vw);height:auto}
.divider{width:0;height:1px;margin:26px 0 18px;background:linear-gradient(90deg,transparent,var(--red) 50%,transparent);
  transition:width 1s var(--ease) .75s;box-shadow:0 0 10px rgba(242,47,61,.5)}
.s1.on .divider{width:min(150px,40vw)}
.tagline{font:400 11px/1.4 var(--sans);letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.32);
  text-align:center;padding:0 24px;opacity:0;transform:translateY(4px);transition:opacity .9s ease 1.15s,transform .9s var(--ease) 1.15s}
.s1.on .tagline{opacity:1;transform:none}

/* ───────── STAGE 2 · LEADS → HUB ───────── */
.s2{--cx:min(300px,30vw);--cy:min(150px,21vh);--fx:56vw;--fy:58vh}
.hub{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:var(--surface);border:1px solid rgba(242,47,61,.55);display:grid;place-items:center;z-index:2;
  box-shadow:0 0 22px rgba(242,47,61,.32),inset 0 0 14px rgba(242,47,61,.14);
  opacity:0;transform:scale(.6);transition:opacity .6s ease,transform .8s var(--spring),box-shadow .5s ease}
.s2.on .hub{opacity:1;transform:scale(1)}
.hub.flare{box-shadow:0 0 46px rgba(242,47,61,.6),0 0 90px rgba(242,47,61,.25),inset 0 0 18px rgba(242,47,61,.3);transform:scale(1.1)}
.hub::before,.hub::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(242,47,61,.32);animation:ring 2.6s ease-out infinite}
.hub::after{inset:-26px;border-color:rgba(242,47,61,.18);animation-delay:1.3s}
@keyframes ring{0%{transform:scale(.8);opacity:0}25%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.hub svg{width:20px;height:20px;stroke:var(--red);fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}

.card{position:absolute;left:50%;top:50%;width:232px;z-index:3;
  --x0:calc(var(--sx) * var(--fx));--y0:calc(var(--sy) * var(--fy));
  --x1:calc(var(--sx) * var(--cx));--y1:calc(var(--sy) * var(--cy));
  transform:translate(-50%,-50%) translate(var(--x0),var(--y0)) scale(.94);opacity:0;
  transition:transform 1.25s var(--ease),opacity .8s ease}
.card.q1{--sx:-1;--sy:-1}.card.q2{--sx:1;--sy:-1}.card.q3{--sx:-1;--sy:1}.card.q4{--sx:1;--sy:1}
.card.in{transform:translate(-50%,-50%) translate(var(--x1),var(--y1));opacity:1}
.card.absorb{transform:translate(-50%,-50%) scale(.5);opacity:0;
  transition:transform .85s cubic-bezier(.7,0,.25,1),opacity .55s ease .25s}
.card-in{background:rgba(24,21,38,.92);border:1px solid rgba(255,255,255,.08);border-radius:10px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  padding:11px 14px;animation:float 5s ease-in-out infinite}
.card.q2 .card-in{animation-delay:-1.2s}.card.q3 .card-in{animation-delay:-2.4s}.card.q4 .card-in{animation-delay:-3.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.c-top{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.c-dot{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 2px var(--c)}
.c-st{font:500 9.5px/1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--c)}
.c-time{margin-left:auto;font:400 9.5px/1 var(--mono);color:rgba(255,255,255,.26)}
.c-main{display:flex;align-items:center;gap:10px}
.c-av{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font:500 10.5px/1 var(--sans);letter-spacing:.5px;
  color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 55%,#302D40),#1d1a2c);border:1px solid rgba(255,255,255,.1)}
.c-nm{font:500 13px/1.25 var(--sans);color:rgba(255,255,255,.92)}
.c-mt{font:400 11px/1.35 var(--sans);color:rgba(255,255,255,.45);margin-top:2px}
.c-ft{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.06);font:400 10.5px/1 var(--sans);color:rgba(255,255,255,.35)}
.c-ft b{font-weight:500;color:rgba(255,255,255,.7)}

/* ───────── STAGE 3 · JOURNEY ───────── */
.s3-wrap{width:min(780px,92vw);display:flex;flex-direction:column;align-items:center;gap:34px}
.eyebrow{font:400 11px/1 var(--mono);letter-spacing:3px;color:rgba(255,255,255,.25);text-transform:uppercase;text-align:center}
.pipe{display:flex;align-items:flex-start;width:100%}
.node{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;gap:13px}
.ico{position:relative;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  transition:background .35s ease,border-color .35s ease,box-shadow .35s ease,transform .45s var(--spring)}
.ico>svg{width:20px;height:20px;fill:none;stroke:rgba(255,255,255,.32);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s ease}
.node.active .ico{background:rgba(242,47,61,.10);border-color:rgba(242,47,61,.38);box-shadow:0 0 22px rgba(242,47,61,.14);transform:scale(1.08)}
.node.active .ico>svg{stroke:#fff}
.node.done .ico{background:rgba(31,157,99,.10);border-color:rgba(31,157,99,.35);box-shadow:0 0 18px rgba(31,157,99,.08);transform:scale(1)}
.node.done .ico>svg{stroke:rgba(31,157,99,.9)}
.chk{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--ok);display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--bg),0 0 10px rgba(31,157,99,.5);transform:scale(0);transition:transform .5s var(--spring)}
.chk svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.node.done .chk{transform:scale(1)}
.lbl{font:400 9.5px/1 var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.28);white-space:nowrap;transition:color .3s ease}
.node.active .lbl{color:#fff}.node.done .lbl{color:rgba(255,255,255,.66)}
.conn{flex:1 1 auto;height:1px;margin:23px 10px 0;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.conn i{position:absolute;inset:0;background:linear-gradient(90deg,var(--ok),var(--red));transform:scaleX(0);transform-origin:left;transition:transform .42s cubic-bezier(.4,0,.2,1)}
.conn.lit i{transform:scaleX(1)}
.caption{font:italic 300 15px/1.4 var(--sans);color:rgba(255,255,255,.5);letter-spacing:.2px;opacity:0;transform:translateY(6px);transition:opacity .8s ease,transform .8s var(--ease)}
.caption.on{opacity:1;transform:none}

/* ───────── STAGE 4 · MAP ───────── */
.s4-wrap{width:96vw;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-26px}
.map{width:100%;height:auto;display:block;opacity:0;transform:scale(1.025);transition:opacity 1s ease,transform 1.4s var(--ease)}
.s4.on .map{opacity:1;transform:none}
.land{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.09);stroke-width:.6;stroke-linejoin:round}
.grat{fill:none;stroke:rgba(255,255,255,.04);stroke-width:.6}
.trail{fill:none;stroke-width:1;stroke-opacity:.16;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.flow{fill:none;stroke-width:1.1;stroke-opacity:.45;stroke-dasharray:5 8;opacity:0;transition:opacity .6s ease .45s;animation:flow 1.1s linear infinite}
.route.on .trail{stroke-dashoffset:0}.route.on .flow{opacity:1}
@keyframes flow{to{stroke-dashoffset:-26}}
.nd{opacity:0;transition:opacity .5s ease}
.nd.on{opacity:1}
.nd .core{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .55s var(--spring)}
.nd.on .core{transform:scale(1)}
.nd .ring{fill:none;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.nd text{font:600 9px var(--sans);fill:rgba(255,255,255,.8);letter-spacing:.8px;text-transform:uppercase}
.nd.origin text{fill:#fff;font-size:9.5px}
.pt{pointer-events:none}
.map-meta{display:flex;gap:22px;font:400 10px/1 var(--mono);letter-spacing:2px;color:rgba(255,255,255,.3);text-transform:uppercase;font-variant-numeric:tabular-nums}
.map-meta b{font-weight:500;color:rgba(255,255,255,.75)}

/* ───────── FOOTER · STATUS + PROGRESS ───────── */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px 40px 26px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));pointer-events:none;transition:background .6s ease}
.foot-row{display:flex;align-items:baseline;gap:14px;margin-bottom:11px;font:400 10.5px/1 var(--mono);color:rgba(255,255,255,.28);transition:color .6s ease}
.stg{color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;transition:color .6s ease}
.msg{transition:opacity .25s ease}
.pct{margin-left:auto;font-variant-numeric:tabular-nums}
.track{position:relative;height:1.5px;background:rgba(255,255,255,.05);border-radius:2px;transition:background .6s ease}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;
  background:linear-gradient(90deg,rgba(242,47,61,.7),#F22F3D);transition:width .55s cubic-bezier(.4,0,.2,1)}
.fill::after{content:"";position:absolute;right:-2px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:#fff;
  box-shadow:0 0 6px #fff,0 0 12px rgba(242,47,61,.8)}
.fill.instant{transition:none}
body.light .foot{background:linear-gradient(180deg,rgba(243,244,250,0),rgba(243,244,250,.92) 40%)}
body.light .foot-row{color:rgba(48,45,64,.5)}
body.light .stg{color:rgba(48,45,64,.75)}
body.light .track{background:rgba(48,45,64,.09)}
body.light .fill::after{box-shadow:0 0 6px rgba(242,47,61,.7),0 0 12px rgba(242,47,61,.5);background:#fff;border:1px solid rgba(242,47,61,.6)}

/* ───────── BUTTONS ───────── */
.ctl{position:fixed;right:40px;bottom:72px;z-index:40;padding:8px 14px;border-radius:999px;font:500 11.5px/1 var(--sans);letter-spacing:.3px;
  color:rgba(255,255,255,.88);background:rgba(48,45,64,.78);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(9,8,15,.25);
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .45s ease,transform .45s var(--ease),background .2s ease}
.ctl.show{opacity:1;transform:none;pointer-events:auto}
.ctl:hover{background:rgba(48,45,64,.95)}
.ctl kbd{font:400 9.5px/1 var(--mono);margin-left:8px;padding:2px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.55)}
#skip{background:rgba(24,21,38,.6);color:rgba(255,255,255,.6)}

/* ───────── STAGE 5 · DASHBOARD SKELETON ───────── */
#dash{position:fixed;inset:0;z-index:5;background:#F3F4FA;display:grid;grid-template-columns:220px 1fr;grid-template-rows:54px 1fr;
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
#dash.on{opacity:1;visibility:visible;transition:opacity .6s ease,visibility 0s}
.sk{border-radius:6px;background:linear-gradient(90deg,#E7E9F0 0%,#dde0ee 50%,#E7E9F0 100%);background-size:300% 100%;animation:shimmer 1.4s infinite linear}
.sk.d{background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 100%);background-size:300% 100%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-50% 0}}
.side{grid-row:1/3;background:var(--navy);padding:16px 12px;display:flex;flex-direction:column;gap:8px;transform:translateX(-100%);transition:transform .75s var(--ease);z-index:2}
.side.in{transform:none}
.brand{height:38px;margin-bottom:14px;border-radius:8px}
.nav{height:34px;border-radius:8px;opacity:0;transform:translateX(-12px);transition:opacity .45s ease,transform .5s var(--ease)}
.nav.in{opacity:1;transform:none}
.nav.act{background:linear-gradient(90deg,rgba(242,47,61,.22),rgba(242,47,61,.1) 50%,rgba(242,47,61,.22));background-size:300% 100%}
.top{background:#fff;border-bottom:1px solid #E7E9F0;display:flex;align-items:center;gap:10px;padding:0 22px;transform:translateY(-100%);transition:transform .6s var(--ease)}
.top.in{transform:none}
.top .search{width:min(320px,40vw);height:30px;border-radius:8px}
.top .sp{flex:1}
.top .btn{width:78px;height:30px;border-radius:8px}
.top .av{width:30px;height:30px;border-radius:50%}
.main{padding:22px;display:flex;flex-direction:column;gap:16px;overflow:hidden;min-width:0}
.ttl{display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .5s ease}
.ttl.in{opacity:1}
.ttl .a{width:150px;height:18px}.ttl .b{width:90px;height:12px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.panel{background:#fff;border:1px solid #E7E9F0;border-radius:12px;opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .6s var(--ease)}
.panel.in{opacity:1;transform:none}
.kpi{padding:16px;display:flex;flex-direction:column;gap:11px}
.kpi .l{width:46%;height:10px}.kpi .v{width:38%;height:22px}.kpi .dl{width:26%;height:9px}
.charts{display:grid;grid-template-columns:1.65fr 1fr;gap:14px}
.chart{padding:16px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;gap:10px}.ph .a{width:120px;height:11px}.ph .b{width:60px;height:20px;margin-left:auto;border-radius:6px}
.bars{height:150px;display:flex;align-items:flex-end;gap:12px;padding:0 4px;border-bottom:1px solid #EEF0F5}
.bar{flex:1;height:var(--h);border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,rgba(242,47,61,.34),rgba(242,47,61,.07));transform:scaleY(0);transform-origin:bottom;transition:transform .8s var(--ease)}
.bars.in .bar{transform:scaleY(1)}
.donut-row{display:flex;align-items:center;gap:20px;height:150px}
.donut{width:120px;height:120px;flex:0 0 120px;transform:rotate(-90deg)}
.donut .bgc{fill:none;stroke:#EEF0F5;stroke-width:13}
.donut .fgc{fill:none;stroke:url(#dg);stroke-width:13;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;transition:stroke-dashoffset 1.2s var(--ease)}
.donut.in .fgc{stroke-dashoffset:115.6}
.legend{flex:1;display:flex;flex-direction:column;gap:10px}
.legend div{height:9px}
.table{padding:6px 0}
.tr{display:grid;grid-template-columns:28px 1.4fr 1fr 1fr 1fr 74px;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid #F1F2F7}
.tr:last-child{border-bottom:0}
.tr.h{padding-top:10px;padding-bottom:10px}
.tr .c{height:9px}.tr.h .c{height:8px;opacity:.75}
.tr .ava{width:28px;height:28px;border-radius:50%}
.tr .badge{height:20px;border-radius:999px}
.tr .badge.r{background:linear-gradient(90deg,rgba(242,47,61,.13),rgba(242,47,61,.22),rgba(242,47,61,.13));background-size:300% 100%}
.tr .badge.g{background:linear-gradient(90deg,rgba(31,157,99,.12),rgba(31,157,99,.22),rgba(31,157,99,.12));background-size:300% 100%}
.tr .badge.w{background:linear-gradient(90deg,rgba(217,138,31,.13),rgba(217,138,31,.24),rgba(217,138,31,.13));background-size:300% 100%}

/* ───────── RESPONSIVE ───────── */
@media (max-width:900px){
  #dash{grid-template-columns:64px 1fr}
  .side{padding:16px 10px}.brand{height:34px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .charts .panel:last-child{display:none}
  .tr{grid-template-columns:28px 1.4fr 1fr 74px}.tr .c.x{display:none}
}
@media (max-width:640px){
  .s2{--cx:23vw;--cy:24vh}
  .card{width:168px}.card-in{padding:10px 11px}.c-ft{display:none}.c-time{display:none}.c-av{flex-basis:26px;height:26px}
  .c-nm{font-size:12px}.c-mt{font-size:10px}
  .node{flex-basis:36px}.ico{width:36px;height:36px;border-radius:10px}.ico>svg{width:17px;height:17px}
  .conn{margin:18px 4px 0}
  .s3-wrap{width:86vw}
  .lbl{font-size:7px;letter-spacing:.4px}

const $ = id => document.getElementById(id);

function setStage(n){ $('stg').textContent = String(n).padStart(2,'0') + '/05'; }

function setMsg(i){

  m.style.opacity = 0;
  at(250 / CONFIG.speed, () => { m.textContent = MESSAGES[i]; m.style.opacity = 1; });
}

function setProgress(p){
  $('fill').style.width = p + '%';
  cancelAnimationFrame(rafPct);
  const from = pctNow, t0 = performance.now(), dur = reduced ? 1 : 550;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    pctNow = from + (p - from) * e;
    $('pct').textContent = Math.round(pctNow) + '%';
    if (k < 1) rafPct = requestAnimationFrame(tick);
  };
  rafPct = requestAnimationFrame(tick);
}

    LEADS.map(l => `<div class="card ${l.q}" style="--c:${l.c}"><div class="card-in">
      <div class="c-top"><span class="c-dot"></span><span class="c-st">${l.st}</span><span class="c-time">${l.t} ago</span></div>
      <div class="c-main"><div class="c-av">${l.ini}</div><div><div class="c-nm">${l.nm}</div><div class="c-mt">${l.mt}</div></div></div>
      <div class="c-ft">Counsellor · <b>${l.co}</b></div></div></div>`).join('');
}

function buildS3(){
  const parts = JOURNEY.map(([ic, name], i) =>
    `<div class="node" id="n${i}"><div class="ico"><svg viewBox="0 0 24 24">${ICONS[ic]}</svg>
      <span class="chk"><svg viewBox="0 0 12 12"><path d="M3 6.2l2 2 4-4.2"/></svg></span></div>
      <span class="lbl">${name}</span></div>` + (i < JOURNEY.length - 1 ? `<div class="conn" id="c${i}"><i></i></div>` : ''));
  $('s3').innerHTML = `<div class="s3-wrap"><div class="eyebrow">Student journey</div>
    <div class="pipe">${parts.join('')}</div><div class="caption" id="cap">From first enquiry to university.</div></div>`;
}

function buildS4(){
  $('s4').innerHTML = `<div class="s4-wrap"><div class="eyebrow">Global admissions network</div>
    <svg class="map" id="map" viewBox="0 0 960 500" aria-label="Map of destinations connected to India">
      <defs id="mdefs"></defs>
      <path class="grat" d="${GRAT}"/><path class="land" d="${LAND}"/>
      <g id="gRoutes"></g><g id="gPts"></g><g id="gNodes"></g>
    </svg>
    <div class="map-meta"><span>Origin <b>India</b></span><span>Destinations <b id="dCount">0</b>/6</span><span>Routes <b id="rCount">0</b> live</span></div></div>`;

  const defs = $('mdefs'), gN = $('gNodes'), gR = $('gRoutes'), gP = $('gPts');
  const halo = (id, c) => { const g = svgEl('radialGradient', {id}); g.append(svgEl('stop',{offset:'0','stop-color':c,'stop-opacity':'.38'}), svgEl('stop',{offset:'1','stop-color':c,'stop-opacity':'0'})); defs.append(g); };
  const node = (x, y, c, label, lx, ly, a, r, origin) => {
    const g = svgEl('g', {class:'nd' + (origin ? ' origin' : '')});
    halo('h-' + label, c);
    g.append(svgEl('circle',{cx:x,cy:y,r:origin?28:22,fill:`url(#h-${label})`}),
             svgEl('circle',{class:'ring',cx:x,cy:y,r:origin?12:10,stroke:c}),
             svgEl('circle',{class:'core',cx:x,cy:y,r,fill:c}));
    const t = svgEl('text',{x:x+lx,y:y+ly,'text-anchor':a}); t.textContent = label; g.append(t);
    gN.append(g); return g;
  };

  const [ox, oy] = P.india;
  routes = DEST.map(d => {
    const [x, y] = P[d.k], mx = (ox + x) / 2, my = (oy + y) / 2, dist = Math.hypot(x - ox, y - oy);
    const cx = mx, cy = my - dist * 0.32;
    const dPath = `M${ox} ${oy} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x} ${y}`;
    const g = svgEl('g', {class:'route'});
    g.append(svgEl('path',{class:'trail',d:dPath,stroke:d.c,pathLength:1}), svgEl('path',{class:'flow',d:dPath,stroke:d.c}));
    gR.append(g);
    const glow = svgEl('circle',{class:'pt',r:5.5,fill:d.c,opacity:0}), dot = svgEl('circle',{class:'pt',r:2.5,fill:d.c,opacity:0});
    gP.append(glow, dot);
    const n = node(x, y, d.c, d.n, d.lx, d.ly, d.a, 5, false);
    return {g, n, glow, dot, p:[ox,oy,cx,cy,x,y], dur: 1400 + dist * 3.2, t0: 0, live: false};
  });
  routes.origin = node(ox, oy, '#F22F3D', 'India', 0, 22, 'middle', 6, true);
}

function buildDash(){
  const sk = (cls='') => `<div class="sk ${cls}"></div>`;
  const heights = [44,62,38,74,56,90,68];
  const rows = [['r'],['g'],['w'],['r']];
  $('dash').innerHTML = `
    <aside class="side" id="dSide"><div class="sk d brand"></div>
      ${Array.from({length:7},(_,i)=>`<div class="sk d nav${i===0?' act':''}"></div>`).join('')}</aside>
    <header class="top" id="dTop">${sk('search')}<span class="sp"></span>${sk('btn')}${sk('btn')}${sk('av')}</header>
    <main class="main">
      <div class="ttl" id="dTtl">${sk('a')}${sk('b')}</div>
      <div class="kpis">${Array.from({length:4},()=>`<div class="panel kpi">${sk('l')}${sk('v')}${sk('dl')}</div>`).join('')}</div>
      <div class="charts">
        <div class="panel chart"><div class="ph">${sk('a')}${sk('b')}</div>
          <div class="bars" id="dBars">${heights.map(h=>`<div class="bar" style="--h:${h}%"></div>`).join('')}</div></div>
        <div class="panel chart"><div class="ph">${sk('a')}</div>
          <div class="donut-row"><svg class="donut" id="dDonut" viewBox="0 0 120 120">
            <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F22F3D" stop-opacity=".75"/><stop offset="1" stop-color="#F22F3D" stop-opacity=".3"/></linearGradient></defs>
            <circle class="bgc" cx="60" cy="60" r="46"/><circle class="fgc" cx="60" cy="60" r="46"/></svg>
            <div class="legend">${[80,64,72,52].map(w=>`<div class="sk" style="width:${w}%"></div>`).join('')}</div></div></div>
      </div>
      <div class="panel table" id="dTable">
        <div class="tr h"><span></span>${sk('c')}${sk('c')}${sk('c x')}${sk('c x')}${sk('c')}</div>
        ${rows.map(([b])=>`<div class="tr">${sk('ava')}${sk('c')}${sk('c')}${sk('c x')}${sk('c x')}<div class="sk badge ${b}"></div></div>`).join('')}
      </div>
    </main>`;
}

/* ═══════ MAP PARTICLES (single rAF loop) ═══════ */
function mapLoop(now){
  for (const r of routes){
    if (!r.live) continue;
    const t = ((now - r.t0) % r.dur) / r.dur, u = 1 - t, [x0,y0,cx,cy,x1,y1] = r.p;
    const x = u*u*x0 + 2*u*t*cx + t*t*x1, y = u*u*y0 + 2*u*t*cy + t*t*y1;
    const o = Math.sin(Math.PI * t);
    r.dot.setAttribute('cx', x); r.dot.setAttribute('cy', y); r.dot.setAttribute('opacity', o.toFixed(3));
    r.glow.setAttribute('cx', x); r.glow.setAttribute('cy', y); r.glow.setAttribute('opacity', (o * .22).toFixed(3));
  }
  rafMap = requestAnimationFrame(mapLoop);
}

/* ═══════ STAGE 5 · DASHBOARD (shared by full run and skip) ═══════ */
function runDashboard(t){
  at(t, () => {
    cancelAnimationFrame(rafMap);
    $('loader').classList.add('gone');
    document.body.classList.add('light');
    $('dash').classList.add('on'); $('dash').setAttribute('aria-hidden','false');
    $('skip').classList.remove('show');
    setStage(5);
  });
  at(t + 600, () => { $('loader').style.display = 'none'; });
  at(t + 150, () => $('dSide').classList.add('in'));
  document.querySelectorAll('#dash .nav').forEach((n, i) => at(t + 350 + i * 60, () => n.classList.add('in')));
  at(t + 400, () => $('dTop').classList.add('in'));
  at(t + 550, () => $('dTtl').classList.add('in'));
  document.querySelectorAll('#dash .kpi').forEach((k, i) => at(t + 700 + i * 90, () => k.classList.add('in')));
  at(t + 900, () => setMsg(6));
  document.querySelectorAll('#dash .chart').forEach((c, i) => at(t + 1150 + i * 150, () => c.classList.add('in')));
  at(t + 1350, () => { $('dBars').classList.add('in'); $('dDonut').classList.add('in'); });
  at(t + 1750, () => $('dTable').classList.add('in'));
  at(t + 2200, () => {
    setProgress(100); setMsg(7); finished = true;
    window.dispatchEvent(new CustomEvent('akbar:ready'));
  });
  at(t + 3700, () => $('replay').classList.add('show'));
}

/* ═══════ RESET ═══════ */
function reset(){
  timers.forEach(clearTimeout); timers = [];
  cancelAnimationFrame(rafMap); cancelAnimationFrame(rafPct);
  finished = false;
  ['s1','s2','s3','s4'].forEach(id => $(id).className = 'stage ' + id);
  buildS1(); buildS2(); buildS3(); buildS4(); buildDash();
  const L = $('loader'); L.style.display = ''; L.classList.remove('gone');
  const D = $('dash'); D.classList.remove('on'); D.setAttribute('aria-hidden','true');
  document.body.classList.remove('light');
  $('replay').classList.remove('show'); $('skip').classList.remove('show');
  const f = $('fill'); f.classList.add('instant'); f.style.width = '0%'; void f.offsetWidth; f.classList.remove('instant');
  pctNow = 0; $('pct').textContent = '0%'; $('msg').textContent = ''; setStage(1);
}

/* ═══════ TIMELINE ═══════ */
function run(){
  reset();

  // STAGE 1 · Logo reveal (0 – 2.5s)
  at(60,   () => { show('s1'); setMsg(0); setProgress(8); });
  at(900,  () => $('skip').classList.add('show'));
  at(1500, () => setProgress(20));

  // STAGE 2 · Leads fly to hub (2.5 – 5s)
  at(2500, () => { leave('s1'); show('s2'); setStage(2); setMsg(1); setProgress(27); });
  document.querySelectorAll('#s2 .card').forEach((c, i) => {
    at(2650 + i * 90, () => c.classList.add('in'));
    at(4150 + i * 70, () => c.classList.add('absorb'));
  });
  at(3700, () => { setMsg(2); setProgress(36); });
  at(4500, () => { $('hub').classList.add('flare'); setProgress(45); });
  at(4850, () => $('hub').classList.remove('flare'));

  // STAGE 3 · Student journey (5 – 8s)
  at(5000, () => { leave('s2'); show('s3'); setStage(3); setMsg(3); });
  const base = 5450;
  JOURNEY.forEach((_, i) => {
    const t = base + i * 360;
    at(t,       () => $('n' + i).classList.add('active'));
    at(t + 230, () => { const n = $('n' + i); n.classList.remove('active'); n.classList.add('done'); setProgress(Math.round(45 + (i + 1) * 23 / 6)); });
    if (i < JOURNEY.length - 1) at(t + 200, () => $('c' + i).classList.add("lit"));
  });
  at(7450, () => $('cap').classList.add('on'));

  // STAGE 4 · Global network (8 – 11s)
  at(8000, () => { leave('s3'); show('s4'); setStage(4); setMsg(4); });
  at(8350, () => { routes.origin.classList.add('on'); rafMap = requestAnimationFrame(mapLoop); });
  routes.forEach((r, i) => at(8700 + i * 350, () => {
    r.n.classList.add('on'); r.g.classList.add('on');
    r.t0 = performance.now() + 500; r.live = true;
    $('dCount').textContent = i + 1; $('rCount').textContent = i + 1;
    setProgress(Math.round(68 + (i + 1) * 4.3));
  }));
  at(10500, () => { setMsg(5); setProgress(96); });
  at(11000, () => leave('s4'));

  // STAGE 5 · Dashboard skeleton (11.3 – 13.5s)
  runDashboard(11300);
}

/* ═══════ SKIP / PUBLIC API ═══════ */
function skip(){
  if (finished || document.body.classList.contains('light')) return;
  timers.forEach(clearTimeout); timers = [];
  ['s1','s2','s3','s4'].forEach(id => $(id).classList.add('leave'));
  setProgress(96); setMsg(5);
  runDashboard(250);
}

$('replay').addEventListener('click', run);
$('skip').addEventListener('click', skip);
addEventListener('keydown', e => { if (e.key === 'Escape') skip(); });

// Hook for the real CRM: call AkbarLoader.finish() when data has loaded; listen for 'akbar:ready' to mount the app.
window.AkbarLoader = { replay: run, finish: skip };

// Inside the Lead Ops dashboard (in a frame): the dashboard says when the leads are in ('akbar:finish');
// we tell it when the dashboard stage is on screen ('akbar:intro-done'). No Replay button there.
const EMBED = window.parent !== window;
if (EMBED) {
  addEventListener('message', e => { if (e.data === 'akbar:finish') skip(); });
  addEventListener('akbar:ready', () => { try { parent.postMessage('akbar:intro-done', '*'); } catch (err) {} });
  $('replay').style.display = 'none';
  try { parent.postMessage('akbar:hello', '*'); } catch (err) {}
}
const start = () => run();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
