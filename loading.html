<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akbar Study Abroad · Lead Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #100E1B; --ink: #FFFFFF; --muted: rgba(255,255,255,.58); --faint: rgba(255,255,255,.14);
  --red: #F22F3D; --gold: #F3CF8E;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(70% 55% at 50% 0%, rgba(242,47,61,.16), transparent 70%),
              radial-gradient(60% 50% at 50% 110%, rgba(62,107,214,.18), transparent 70%), var(--bg);
  color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased;
  display: grid; place-items: center; overflow: hidden; padding: 24px 16px;
}
.grid {
  position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 26px 26px;
  -webkit-mask-image: radial-gradient(ellipse 55% 50% at 50% 50%, #000 0%, transparent 75%);
          mask-image: radial-gradient(ellipse 55% 50% at 50% 50%, #000 0%, transparent 75%);
}
main { position: relative; width: min(440px, 100%); text-align: center; animation: rise .8s cubic-bezier(.16,1,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.logo { display: block; height: 52px; width: auto; margin: 0 auto 36px; user-select: none; -webkit-user-drag: none; }
.logo-text { display: none; font-weight: 600; font-size: 26px; letter-spacing: .14em; margin-bottom: 36px; }
.logo-text span { color: var(--red); }

.route { position: relative; height: 92px; margin: 0 auto; width: 100%; max-width: 380px; }
.route svg { width: 100%; height: 100%; overflow: visible; }
.track { fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 3 6; }
.trail { fill: none; stroke: var(--red); stroke-width: 2.2; stroke-linecap: round; }
.pin { fill: var(--bg); stroke: rgba(255,255,255,.7); stroke-width: 1.5; }
.pin.to { stroke: var(--gold); }
.code { font: 500 11px var(--mono); letter-spacing: .12em; fill: var(--muted); }
#plane { transition: opacity .3s ease; }

h1 { font-weight: 600; font-size: 22px; letter-spacing: -.01em; margin-top: 26px; }
.status { margin-top: 8px; font-size: 14px; color: var(--muted); min-height: 1.4em; transition: opacity .25s ease; }
.bar { margin: 22px auto 0; width: 160px; height: 3px; border-radius: 3px; background: var(--faint); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--red), #FF6B75); border-radius: 3px; transition: width .35s ease; }
.foot { position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom)); text-align: center; font: 500 10.5px var(--mono); letter-spacing: .16em; color: rgba(255,255,255,.32); }
body.done main { animation: none; transition: opacity .45s ease, transform .45s ease; opacity: 0; transform: scale(.985); }
@media (prefers-reduced-motion: reduce) { main { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<main role="status" aria-live="polite">
  <img class="logo" id="logo" src="portal/logo.png" alt="Akbar Study Abroad">
  <div class="logo-text" id="logoText">AKB<span>A</span>R</div>
  <div class="route" aria-hidden="true">
    <svg viewBox="0 0 380 92" preserveAspectRatio="xMidYMid meet">
      <path id="arc" class="track" d="M24 74 Q190 -14 356 74"/>
      <path id="trail" class="trail" d="M24 74 Q190 -14 356 74"/>
      <circle class="pin" cx="24" cy="74" r="5"/>
      <circle class="pin to" cx="356" cy="74" r="5"/>
      <text class="code" x="24" y="92" text-anchor="middle">YOU</text>
      <text class="code" x="356" y="92" text-anchor="middle">LEADS</text>
      <g id="plane"><path d="M0 -1.6 L-7 -6.5 L-5 0 L-7 6.5 L0 1.6 L9 1.2 Q11 0 9 -1.2 Z" fill="#fff"/></g>
    </svg>
  </div>
  <h1 id="hello">Welcome back</h1>
  <p class="status" id="status">Signing you in…</p>
  <div class="bar"><i id="bar"></i></div>
</main>
<div class="foot">AKBAR STUDY ABROAD · LEAD OPS</div>
<script>
(function () {
  'use strict';
  var embedded = /[?&]embed=1/.test(location.search);
  var STEPS = ['Signing you in…', 'Loading your leads…', 'Getting follow-ups ready…', 'Checking what needs a call today…', 'Almost there…'];
  var arc = document.getElementById('arc'), trail = document.getElementById('trail'), plane = document.getElementById('plane');
  var bar = document.getElementById('bar'), status = document.getElementById('status');
  var len = arc.getTotalLength();
  trail.style.strokeDasharray = len; trail.style.strokeDashoffset = len;

  var h = new Date().getHours();
  document.getElementById('hello').textContent = h < 5 ? 'Welcome back' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';

  var logo = document.getElementById('logo');
  logo.onerror = function () { logo.style.display = 'none'; document.getElementById('logoText').style.display = 'block'; };

  var p = 0, target = 0, finishing = false, step = -1, start = Date.now();
  function setStep(i) {
    if (i === step || i >= STEPS.length) return;
    step = i; status.style.opacity = 0;
    setTimeout(function () { status.textContent = STEPS[i]; status.style.opacity = 1; }, 180);
  }
  function draw() {
    var at = arc.getPointAtLength(len * p), ahead = arc.getPointAtLength(Math.min(len, len * p + 1));
    var ang = Math.atan2(ahead.y - at.y, ahead.x - at.x) * 180 / Math.PI;
    plane.setAttribute('transform', 'translate(' + at.x.toFixed(1) + ' ' + at.y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')');
    trail.style.strokeDashoffset = (len * (1 - p)).toFixed(1);
    bar.style.width = (p * 100).toFixed(1) + '%';
  }
  function tick() {
    var t = (Date.now() - start) / 1000;
    if (!finishing) target = 0.92 * (1 - Math.exp(-t / 2.6)); // eases toward 92 % until the dashboard says the leads are in
    p += (target - p) * (finishing ? 0.2 : 0.08);
    if (!finishing) setStep(Math.min(STEPS.length - 1, Math.floor(t / 1.6)));
    draw();
    if (finishing && p > 0.995) { p = 1; draw(); done(); return; }
    requestAnimationFrame(tick);
  }
  var ended = false;
  function done() {
    if (ended) return; ended = true;
    status.textContent = 'Ready';
    setTimeout(function () {
      document.body.classList.add('done');
      try { if (embedded) parent.postMessage('akbar:intro-done', '*'); } catch (e) { /* not in a frame */ }
      if (!embedded) setTimeout(function () { document.body.classList.remove('done'); p = 0; finishing = false; ended = false; step = -1; start = Date.now(); requestAnimationFrame(tick); }, 1200);
    }, 350);
  }
  function finish() { finishing = true; target = 1; }

  draw(); requestAnimationFrame(tick);
  window.AkbarLoader = { finish: finish };
  addEventListener('message', function (e) { if (e.data === 'akbar:finish') finish(); });
  if (embedded) { try { parent.postMessage('akbar:hello', '*'); } catch (e) { /* not in a frame */ } }
  else setTimeout(finish, 4500); // opened on its own: play once as a preview
})();
</script>
</body>
</html>
